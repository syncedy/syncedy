<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7FAFB">
</head>
<body>
<title>SyncEdy MVP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra in alto (logo Orbita, ricerca), tab in basso su telefono e in alto su desktop.
   Sotto: colonna laterale con Edy e contesto, a destra la vista attiva. Sotto i 900px tutto in colonna. */
:root {
  /* Palette Orbita: Notte, Teal, Sole, Nebbia. Tema sempre chiaro. */
  --bg: #F7FAFB; --surface: #FFFFFF; --surface-2: #EDF3F5; --ink: #14213D; --muted: #5A6A7D; --line: #E1E8EC;
  --accent: #19C3B2; --accent-ink: #087A70; --accent-soft: #DDF6F3; --sat: #FFC857; --sat-soft: #FFF2D1;
  --ok: #187A45; --warn: #B4400C; --warn-soft: #FDE8DC; --edy-face: #14213D;
  --c1: #19C3B2; --c2: #E8920C; --c3: #E5593B; --c4: #3F7BE0; --c5: #7FAE2E;
  --f-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body);
  padding-block: 0 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1120px; margin: 0 auto; }
[hidden] { display: none !important; }

/* Barra in alto */
.top { display: flex; align-items: center; gap: 12px 24px; flex-wrap: wrap; padding-block: 16px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { width: 36px; height: 36px; flex: none; }
.wm { font: 500 25px/1 var(--f-display); letter-spacing: -0.02em; }
.wm b { font-weight: 800; color: var(--accent-ink); }
.lg-a { stroke: var(--accent); } .lg-b { stroke: var(--ink); } .lg-s { fill: var(--sat); }
.search { position: relative; flex: 1 1 200px; max-width: 360px; }
.search input { background: var(--surface); padding-left: 12px; }
.sres { position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 6px); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px rgb(20 33 61 / .12); padding: 6px; display: grid; gap: 2px; max-height: 340px; overflow: auto; }
.sres button { text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; display: grid; }
.sres button:hover, .sres button:focus-visible { background: var(--surface-2); }
.sres small { color: var(--muted); }
.tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 12px; margin-left: auto; }
.acc { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); color: var(--accent-ink); font: 700 16px/1 var(--f-display); flex: none; padding: 0; }
.acc.on { border-color: var(--accent); background: var(--accent-soft); }
.tab { border: 0; background: none; padding: 8px 14px; border-radius: 9px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(20 33 61 / .12); }
@media (max-width: 760px) {
  body { padding-bottom: 88px; }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; margin: 0; border-radius: 0; background: var(--surface); border-top: 1px solid var(--line); justify-content: space-between;
    padding: 6px max(10px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px)); }
  .tab { flex: 1; padding: 10px 2px; font-size: 12px; text-align: center; }
  .tab[aria-selected="true"] { background: var(--accent-soft); color: var(--accent-ink); box-shadow: none; }
}

.grid { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 900px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  aside { display: contents; }
  #edybox { order: -1; } #view { order: 0; } aside > .panel:not(.edy) { order: 1; }
  .edy-fig { width: 72px; }
}
aside { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
@media (min-width: 901px) { aside { position: sticky; top: 16px; } }
.stack { display: grid; gap: 16px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; min-width: 0; }
h2 { font: 700 20px/1.2 var(--f-display); letter-spacing: -0.01em; margin: 0 0 4px; text-wrap: balance; }
h3 { font: 700 15px/1.3 var(--f-display); margin: 0; }
.sub { color: var(--muted); margin: 0 0 14px; }
.label { font: 500 11px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); }
.mono { font-variant-numeric: tabular-nums; }

/* Edy */
.edy { display: flex; gap: 12px; align-items: flex-start; }
.edy-fig { width: 92px; flex: none; animation: float 4.5s ease-in-out infinite; }
.edy-fig svg { width: 100%; height: auto; display: block; }
.edy-bubble { background: var(--surface-2); border-radius: 14px 14px 14px 4px; padding: 10px 12px; font-size: 14px; min-width: 0; }
.edy-bubble.worried { background: var(--sat-soft); }
.edy-name { font: 700 13px var(--f-display); color: var(--accent-ink); display: block; margin-bottom: 2px; }
.e-planet { fill: var(--accent); } .e-ring { fill: none; stroke: var(--sat); stroke-width: 5; stroke-linecap: round; }
.e-face { fill: var(--edy-face); } .e-line { fill: none; stroke: var(--edy-face); stroke-width: 3.2; stroke-linecap: round; }
.e-drop { fill: #8EDDF5; }
.e-eyes { animation: blink 5s infinite; transform-origin: 60px 46px; }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes blink { 0%,94%,100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }

/* Campi e bottoni */
.fields { display: grid; gap: 12px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: 13px; color: var(--muted); }
input[type=number], input[type=text], input[type=date], select, textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; min-width: 0; }
input[type=number] { font-variant-numeric: tabular-nums; }
textarea { min-height: 84px; resize: vertical; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 600; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #053B36; }
.btn.primary:hover { filter: brightness(1.05); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.big { padding: 12px 18px; font-size: 16px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.between { justify-content: space-between; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 4px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.chip.ok { background: var(--accent-soft); color: var(--accent-ink); }
.chip.gap { background: var(--warn-soft); color: var(--warn); }
.pill { font: 500 11px/1 var(--f-mono); padding: 5px 8px; border-radius: 99px; white-space: nowrap; background: var(--accent-soft); color: var(--accent-ink); }
.pill.risk { background: var(--warn-soft); color: var(--warn); } .pill.done { background: var(--surface-2); color: var(--muted); }
.empty { padding: 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 14px; }

/* Oggi */
.hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; position: relative; }
.ringbox { position: relative; width: 104px; height: 104px; }
.ringbox svg { display: block; }
.ringtxt { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font: 800 22px/1 var(--f-display); }
.ringtxt small { display: block; font: 500 10px var(--f-mono); color: var(--muted); letter-spacing: .06em; margin-top: 3px; }
.hello { font: 700 24px/1.15 var(--f-display); letter-spacing: -0.015em; text-wrap: balance; }
.sparks i { position: absolute; left: 52px; top: 52px; width: 8px; height: 8px; border-radius: 50%; background: var(--sat); animation: spark .9s ease-out forwards; }
@keyframes spark { from { transform: translate(-50%, -50%); opacity: 1; } to { transform: translate(calc(-50% + cos(var(--a)) * 70px), calc(-50% + sin(var(--a)) * 70px)); opacity: 0; } }
.task { background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--c); border-radius: 16px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.task.finished { background: var(--accent-soft); border-color: transparent; border-left-color: var(--c); }
.task h3 { font-size: 18px; }
.task .now { font-size: 15px; }
.task .now b { font-weight: 600; }
.bigrow { display: flex; gap: 8px; flex-wrap: wrap; }
.inline-less { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.inline-less input { width: 96px; }
.streak { display: grid; gap: 10px; }
.streak .num { font: 800 36px/1 var(--f-display); }
.dots { display: flex; gap: 6px; }
.dots i { flex: 1; height: 10px; border-radius: 6px; background: var(--surface-2); }
.dots i.on { background: var(--sat); } .dots i.rest { background: var(--accent-soft); }
.banner { background: var(--sat-soft); border-radius: 16px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

/* Esami */
.exams { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.ecard { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 16px; padding: 14px; display: grid; gap: 10px; text-align: left; width: 100%; }
.ecard:hover { border-color: var(--c); }
.prog { height: 8px; border-radius: 9px; background: var(--surface-2); overflow: hidden; }
.prog > i { display: block; height: 100%; background: var(--c, var(--accent)); border-radius: 9px; }
.topic { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.topic > summary { list-style: none; display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; cursor: pointer; }
.topic > summary::-webkit-details-marker { display: none; }
.dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); }
.dot.doing { border-color: var(--accent); background: linear-gradient(90deg, var(--accent) 50%, transparent 50%); }
.dot.done { border-color: var(--accent); background: var(--accent); }
.tbody { padding: 0 12px 12px; display: grid; gap: 12px; }
.mat { display: flex; justify-content: space-between; gap: 10px; padding: 8px 10px; background: var(--surface-2); border-radius: 10px; font-size: 14px; }
.mat span { color: var(--muted); font-size: 12px; }
.tlist { display: grid; gap: 8px; }
.back { margin-bottom: 4px; }

/* Piano: giorno per giorno */
.stat-row { display: flex; gap: 8px 28px; flex-wrap: wrap; padding: 2px 2px 0; }
.stat b { display: block; font: 700 22px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.days { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.day { display: grid; grid-template-columns: 86px minmax(0, 1fr) 56px auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; border: 1px solid transparent; }
.day.today { background: var(--accent-soft); } .day.off { opacity: .6; } .day.examday { border-color: var(--sat); }
.dl { font: 500 12px/1.25 var(--f-mono); } .dl b { display: block; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.bar { display: flex; height: 18px; background: var(--surface-2); border-radius: 6px; overflow: hidden; gap: 2px; }
.seg { background: var(--c); min-width: 3px; }
.seg.review { background: repeating-linear-gradient(135deg, var(--c) 0 4px, transparent 4px 8px); outline: 1px solid var(--c); outline-offset: -1px; }
.items { grid-column: 2 / 4; font: 400 11px/1.4 var(--f-mono); color: var(--muted); }
.tot { font: 500 13px var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }
.badge-exam { grid-column: 2 / 5; font-weight: 600; color: var(--warn); }
@media (max-width: 520px) { .day { grid-template-columns: 64px minmax(0, 1fr) 46px; } .day .btn { grid-column: 2 / 4; justify-self: start; } .items { grid-column: 1 / 4; } .hero { grid-template-columns: minmax(0, 1fr); } }
.legend { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--c); margin-right: 6px; }

/* Confronto */
.res { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.res summary { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; cursor: pointer; list-style: none; align-items: center; }
.res summary::-webkit-details-marker { display: none; }
.score { font: 800 24px/1 var(--f-display); font-variant-numeric: tabular-nums; text-align: right; }
.score small { font: 500 11px var(--f-mono); display: block; color: var(--muted); letter-spacing: .04em; }
.meter { grid-column: 1 / 3; height: 6px; border-radius: 9px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.res-body { display: grid; gap: 10px; padding-top: 12px; }

/* Passaporto */
.stamps { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.stamp { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 12px; display: grid; gap: 6px; justify-items: center; text-align: center; }
.stamp.got { border-color: var(--sat); background: var(--sat-soft); }
.seal { width: 76px; height: 76px; }
.seal.lock { opacity: .7; }
.tier { font: 500 10px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.authbox { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; place-items: center; padding: 16px; overflow: auto; }
.authcard { width: min(420px, 100%); display: grid; gap: 12px; }
.authmsg { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-weight: 600; font-size: 14px; }
/* Toast */
.toast { position: fixed; z-index: 40; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 14px; font-weight: 600; box-shadow: 0 8px 24px rgb(20 33 61 / .3); max-width: calc(100% - 32px); animation: pop .3s ease-out; }
@keyframes pop { from { transform: translate(-50%, 12px); opacity: 0; } }
@media (min-width: 761px) { .toast { bottom: 28px; } }
@media (prefers-reduced-motion: reduce) { .edy-fig, .e-eyes, .sparks i, .toast { animation: none; } .sparks { display: none; } }
footer { margin-top: 28px; font-size: 12px; color: var(--muted); display: flex; gap: 8px 16px; flex-wrap: wrap; align-items: center; }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand" aria-label="SyncEdy">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <g fill="none" stroke-width="4.6" stroke-linecap="round">
          <path class="lg-a" d="M32 19 A9 9 0 1 0 24 24"/>
          <path class="lg-b" d="M24 24 A9 9 0 1 1 16.2 28.5"/>
        </g>
        <circle class="lg-s" cx="32.4" cy="19.4" r="3.3"/>
      </svg>
      <span class="wm">Sync<b>Edy</b></span>
    </div>
    <div class="search">
      <input type="text" id="q" placeholder="Cerca un argomento, un esame, un corso" autocomplete="off" aria-label="Cerca">
      <div class="sres" id="qres" hidden></div>
    </div>
    <button class="acc" id="accbtn" data-tab="account" aria-label="Il mio account" title="Il mio account">S</button>
    <nav class="tabs" role="tablist" aria-label="Sezioni">
      <button class="tab" role="tab" data-tab="oggi">Oggi</button>
      <button class="tab" role="tab" data-tab="piano">Piano</button>
      <button class="tab" role="tab" data-tab="esami">Esami</button>
      <button class="tab" role="tab" data-tab="materiale">Materiale</button>
      <button class="tab" role="tab" data-tab="confronto">Confronto</button>
      <button class="tab" role="tab" data-tab="passaporto">Passaporto</button>
      <button class="tab" role="tab" data-tab="statistiche" id="tab-stat" hidden>Statistiche</button>
    </nav>
  </header>

  <div class="grid">
    <aside id="aside"></aside>
    <main id="view" class="stack"></main>
  </div>

  <footer>
    <span>Versione beta: i corsi e i programmi del catalogo sono esempi inventati.</span><span id="sync"></span>
    <button class="btn small ghost" data-act="reset">Ripristina esempio</button>
  </footer>
</div>

<script>
/* ==========================================================================
   SyncEdy MVP v2
   Motori: piano di studio (buildPlan) e confronto corsi (compareSets).
   Sopra: schermata Oggi, pagina esame, dubbi/classe, passaporto EduStamp.
   Nessun server: lo stato sta nel browser (localStorage).

// ---------- Utilità ----------
const DAY = 86400000;
const today0 = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const iso = d => { const z = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); };
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const dayIdx = (d, t0) => Math.round((d - t0) / DAY);
const fmtH = h => h.toFixed(1).replace('.', ',') + ' h';
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clip = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;
const $ = id => document.getElementById(id);
const firstName = n => String(n || '').trim().split(/\s+/)[0] || '';

// <pure>
// ---------- 1. MOTORE DEL PIANO DI STUDIO ----------
/* Ogni esame ha una scadenza per il materiale nuovo (data esame - giorni di ripasso - 1).
   Ogni giorno, per ogni esame attivo: ritmo = ore ancora da studiare / giorni di studio disponibili.
   Se la somma dei ritmi sta nelle ore del giorno, si assegna quel ritmo (carico uniforme, niente accumulo
   vicino all'esame). Altrimenti si scala in proporzione e l'esame resta con ore mancanti: rischio.
   Il piano si ricalcola da zero a ogni modifica, quindi un ritardo si ridistribuisce da solo. */
function buildPlan(st, t0 = today0()) {
  const cap = st.settings.hours, pph = st.settings.pph, rev = st.settings.review;
  const off = new Set(st.off);
  const isOff = d => off.has(iso(addDays(t0, d)));
  const ex = st.exams.filter(e => !e.passed).map(e => {
    const examDay = dayIdx(parseISO(e.date), t0);
    const remHours = Math.max(0, e.pages - e.done) / pph;
    const studyEnd = Math.min(Math.max(0, examDay - rev - 1), examDay - 1);
    let avail = 0; for (let k = 0; k <= studyEnd; k++) if (!isOff(k)) avail++;
    return { id: e.id, name: e.name, color: e.color, examDay, studyEnd, rem: remHours, avail };
  }).filter(e => e.examDay >= 1);
  const horizon = Math.max(0, ...ex.map(e => e.examDay));
  const rows = [];
  for (let d = 0; d <= horizon; d++) {
    const row = { d, date: addDays(t0, d), off: isOff(d), items: [], total: 0, exams: ex.filter(e => e.examDay === d).map(e => e.name) };
    rows.push(row);
    if (row.off) continue;
    let room = cap;
    const reviewers = ex.filter(e => d > e.studyEnd && d < e.examDay);
    if (reviewers.length) {
      const reserved = room * 0.5;
      reviewers.forEach(e => row.items.push({ id: e.id, h: reserved / reviewers.length, kind: 'review' }));
      room -= reserved;
    }
    const active = ex.filter(e => e.rem > 1e-6 && d <= e.studyEnd);
    if (active.length) {
      const need = active.map(e => {
        let avail = 0; for (let k = d; k <= e.studyEnd; k++) if (!isOff(k)) avail++;
        return { e, rate: e.rem / Math.max(avail, 1) };
      });
      const sum = need.reduce((a, x) => a + x.rate, 0);
      const scale = sum > room ? room / sum : 1;
      need.forEach(x => { const h = x.rate * scale; x.e.rem -= h; row.items.push({ id: x.e.id, h, kind: 'study' }); });
    }
    row.total = row.items.reduce((a, i) => a + i.h, 0);
  }
  ex.forEach(e => { e.short = e.rem > 0.05 ? e.rem : 0; e.extraPerDay = e.short && e.avail ? e.short / e.avail : 0; });
  return { rows, ex, cap, pph, t0 };
}
function planStats(plan) {
  const next = plan.rows.filter(r => r.d < 7 && !r.off);
  const avg7 = next.length ? next.reduce((a, r) => a + r.total, 0) / next.length : 0;
  const peak = Math.max(0, ...plan.rows.map(r => r.total));
  return { avg7, peak, risk: plan.ex.filter(e => e.short > 0) };
}

// ---------- 2. MOTORE DI CONFRONTO TRA CORSI ----------
/* Il programma (italiano o inglese) diventa un insieme di concetti canonici. La somiglianza è un Jaccard
   pesato: i concetti rari (es. Lagrange) contano più di quelli comuni. */

  ['alg', 'Algebra lineare', /algebra lineare|linear algebra|matric[ei]|matrices|autovalori|eigenvalues?/],
  ['multi', 'Funzioni di più variabili', /pi[uù] variabili|multivariable|several variables/],
  ['term', 'Termodinamica', /termodinamica|thermodynamics/],
  ['em', 'Elettromagnetismo', /elettromagnetismo|electromagnetism|campo elettrico|electric field|maxwell/],
  ['lay', 'Layout di impianto', /layout|plant design|facility design/],
  ['log', 'Logistica e magazzini', /logistic|magazzin|warehouse/],
  ['aff', 'Affidabilità e manutenzione', /affidabilit[àa]|reliability|manutenzione|maintenance/],
  ['ro', 'Ricerca operativa', /ricerca operativa|operations research|programmazione lineare|linear programming/],
  ['sic', 'Sicurezza', /sicurezza|\bsafety\b/],
  ['dim', 'Dimensionamento', /dimensionamento|capacity planning|\bsizing\b/],
  ['tm', 'Tempi e metodi', /tempi e metodi|time and motion|work measurement|cronometr/],
  ['alg2', 'Algoritmi', /algoritm|algorithms?/],
  ['sd', 'Strutture dati', /strutture dati|data structures?/],
  ['prog', 'Programmazione', /programmazione (in|c\b|python|ad oggetti)|\bprogramming\b|\bpython\b/],
  ['cplx', 'Complessità', /complessit[àa]|complexity/],
  ['bil', 'Bilancio', /bilancio|balance sheet|stato patrimoniale/],
  ['cont', 'Contabilità', /contabilit[àa]|accounting|partita doppia|double[- ]entry/],
  ['costi', 'Costi e break-even', /costi|cost accounting|break[- ]even/],
  ['micro', 'Microeconomia', /microeconomia|microeconomics|domanda e offerta|supply and demand/],
].map(([id, label, re]) => ({ id, label, re }));
const LABEL = Object.fromEntries(CONCEPTS.map(c => [c.id, c.label]));
const norm = t => String(t).toLowerCase().replace(/[’‘`´]/g, "'");
function parseSyllabus(text) { const t = norm(text); return new Set(CONCEPTS.filter(c => c.re.test(t)).map(c => c.id)); }
function orderedTopics(text) {                                      // argomenti nell'ordine in cui compaiono nel programma
  const t = norm(text);
  return CONCEPTS.map(c => { const m = c.re.exec(t); return m ? { id: c.id, i: m.index } : null; }).filter(Boolean).sort((a, b) => a.i - b.i).map(x => x.id);
}
function makeIdf(courses) { const N = courses.length, df = {}; courses.forEach(c => c.set.forEach(id => df[id] = (df[id] || 0) + 1)); return id => Math.log(1 + N / (df[id] || 1)); }
function compareSets(a, b, w) {
  let inter = 0, uni = 0; const shared = [], onlyA = [], onlyB = [];
  new Set([...a, ...b]).forEach(id => { const x = w(id); uni += x; if (a.has(id) && b.has(id)) { inter += x; shared.push(id); } else if (a.has(id)) onlyA.push(id); else onlyB.push(id); });
  return { score: uni ? inter / uni : 0, shared, onlyA, onlyB };

function topicInfo(e) {

/* Gli obiettivi del giorno si fissano alla prima apertura e restano stabili finché non c'è un check-in,
   così il numero non cambia sotto gli occhi dello studente mentre studia. */
function snapshotDay(plan) {
  const k = iso(plan.t0);
  if (st.day.date !== k) st.day = { date: k, targets: {}, done: {} };
  if (Object.keys(st.day.done).length) return;
  st.day.targets = {};
  const r = plan.rows[0]; if (!r || r.off) return;
  r.items.forEach(i => {
    const e = examById(i.id);
    if (i.kind === 'study') { const p = Math.min(Math.round(i.h * plan.pph), Math.max(0, e.pages - e.done)); if (p >= 1) st.day.targets[i.id] = { kind: 'study', pages: p, h: i.h }; }
    else st.day.targets[i.id] = { kind: 'review', h: i.h };
  });
}
function goalState() {
  const ids = Object.keys(st.day.targets); let reached = 0, pT = 0, pD = 0;
  ids.forEach(id => {
    const t = st.day.targets[id], d = st.day.done[id] || 0, e = examById(id);
    if (t.kind === 'study') { pT += t.pages; pD += Math.min(d, t.pages); if (d >= t.pages || (e && e.done >= e.pages)) reached++; }
    else if (d >= 1) reached++;
  });
  return { total: ids.length, reached, pT, pD, all: ids.length > 0 && reached === ids.length };
}
function streakOf() {
  const L = new Set(st.log), off = new Set(st.off); let d = today0(), n = 0;
  if (!L.has(iso(d))) d = addDays(d, -1);
  for (let i = 0; i < 400; i++) { const k = iso(d); if (L.has(k)) n++; else if (!off.has(k)) break; d = addDays(d, -1); }
  return n;
}

    <text x="40" y="${s.glyph.length > 2 ? 45 : 47}" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="${s.glyph.length > 1 ? 16 : 22}" fill="${got ? 'var(--ink)' : 'var(--muted)'}">${s.glyph}</text></svg>`;

function checkStamps() {

let toastTimer;

// ---------- Edy: pianeta con l'anello, tre stati dal documento Orbita ----------
/* happy = Felice (obiettivo raggiunto), think = Concentrato (sessione in corso), worried = Scadenza vicina */
function edySVG(mood) {

  }[mood] || '';

}
const setEdy = (mood, text) => { edy = { mood, text }; };
const edyHTML = () => `<div class="panel edy" id="edybox"><div class="edy-fig">${edySVG(edy.mood)}</div>
  <div class="edy-bubble ${edy.mood === 'worried' ? 'worried' : ''}" role="status" aria-live="polite"><span class="edy-name">Edy</span>${esc(edy.text)}</div></div>`;
function refreshEdy() { const n = $('edybox'); if (n) n.outerHTML = edyHTML(); }
function greeting() { const h = new Date().getHours(); return h < 5 ? 'Ciao' : h < 12 ? 'Buongiorno' : h < 18 ? 'Buon pomeriggio' : 'Buonasera'; }
function edyFor(t) {
  const plan = buildPlan(st), s = planStats(plan), soon = plan.ex.find(e => e.examDay <= 7), g = goalState();
  if ((t === 'oggi' || t === 'piano') && s.risk.length) { const e = s.risk[0]; return { mood: 'worried', text: `Occhio a ${e.name}: mancano circa ${fmtH(e.short)}. Aggiungi ${fmtH(e.extraPerDay)} al giorno o accorcia il ripasso e ce la fai.` }; }
  if ((t === 'oggi' || t === 'piano') && soon) return { mood: 'worried', text: `${soon.name} ${soon.examDay === 0 ? 'è oggi' : soon.examDay === 1 ? 'è domani' : `è tra ${soon.examDay} giorni`}: ho rifatto il piano, adesso si punta sul ripasso.` };
  if (t === 'oggi') {
    if (g.total && g.all) return { mood: 'happy', text: 'Missione di oggi compiuta! Il resto della giornata è tuo.' };
    if (g.total && g.reached) return { mood: 'think', text: `Ci sei quasi: ancora ${g.total - g.reached} ${g.total - g.reached === 1 ? 'cosa' : 'cose'} e hai chiuso.` };
    if (g.total) return { mood: 'happy', text: `${greeting()}${firstName(st.name) ? ', ' + firstName(st.name) : ''}! Oggi ${g.total === 1 ? "c'è 1 cosa" : `ci sono ${g.total} cose`} da fare: parti dalla prima, il resto viene da sé.` };
    return { mood: 'happy', text: `${greeting()}${firstName(st.name) ? ', ' + firstName(st.name) : ''}! Oggi sei libero: niente in programma.` };
  }
  if (t === 'piano') return { mood: 'happy', text: 'Ecco il piano. Se salti un giorno, nessun dramma: lo sistemo io.' };
  if (t === 'esami') return { mood: 'happy', text: 'Entra in un esame: argomenti, materiale, dubbi e classe sono lì dentro.' };
  if (t === 'passaporto') { const nx = STAMPS.find(x => !st.stamps[x.id]); return { mood: 'happy', text: nx ? `Ogni timbro è un traguardo vero. Il prossimo: ${nx.title}.` : 'Hai tutti i timbri. Che orbita!' }; }
  if (t === 'account') return { mood: 'happy', text: 'Dimmi che corso segui, così ti trovo chi studia le tue stesse cose.' };
  if (t === 'statistiche') return { mood: 'think', text: 'Qui vedi come va la beta. Questa scheda la vedi solo tu.' };
  if (t === 'materiale') return { mood: 'happy', text: 'Cerca appunti, esercizi e PDF per argomento. Quello che salvi come "solo io" lo vedi solo tu.' };

// ---------- Azioni che cambiano lo stato ----------
function mutate(fn) {                                                // ogni modifica ricalcola il piano e fa commentare Edy
  const before = planStats(buildPlan(st));
  fn();
  const after = planStats(buildPlan(st));
  if (after.risk.length) { const e = after.risk[0]; setEdy('worried', `Occhio a ${e.name}: con questi ritmi mancano circa ${fmtH(e.short)}. Aggiungi ${fmtH(e.extraPerDay)} al giorno o accorcia il ripasso e ce la fai.`); }
  else { const d = after.avg7 - before.avg7;
    if (d > 0.15) setEdy('think', `Rifatto! Nei prossimi 7 giorni passi da ${fmtH(before.avg7)} a ${fmtH(after.avg7)} al giorno. Il giorno più pesante resta a ${fmtH(after.peak)}, dentro le tue ore.`);
    else if (d < -0.15) setEdy('happy', `Sei avanti col programma! Nei prossimi 7 giorni si scende da ${fmtH(before.avg7)} a ${fmtH(after.avg7)} al giorno.`);
    else setEdy('happy', `Piano aggiornato: nei prossimi 7 giorni sono ${fmtH(after.avg7)} al giorno.`); }
  checkStamps(); save(); render(true);
}
function checkin(id, pages) {
  snapshotDay(buildPlan(st));
  const t = st.day.targets[id]; if (!t) return;
  const e = examById(id), before = planStats(buildPlan(st));
  if (t.kind === 'study') { const add = Math.max(0, Math.min(pages, e.pages - e.done)); e.done += add; st.day.done[id] = (st.day.done[id] || 0) + add; }
  else st.day.done[id] = 1;
  const k = iso(today0()); if (!st.log.includes(k)) st.log.push(k);
  const g = goalState(), after = planStats(buildPlan(st)), n = streakOf();
  if (g.all) { ui.burst = true; setEdy('happy', `Obiettivo di oggi fatto! ${n > 1 ? `${n} giorni di fila in orbita, continua così.` : 'Primo giorno in orbita, si parte!'}`); }
  else if (t.kind === 'study' && (st.day.done[id] < t.pages)) setEdy('think', `Ok, segnato! Le pagine che mancano le distribuisco sui prossimi giorni: ora sono ${fmtH(after.avg7)} al giorno.`);
  else setEdy('think', `Segnato! Ti ${g.total - g.reached === 1 ? 'resta ancora 1 cosa' : `restano ancora ${g.total - g.reached} cose`} per oggi.`);
  ui.less = null; checkStamps(); save(); render(true);
}

const ring = (pct, size = 104, sw = 10) => { const r = (size - sw) / 2, c = 2 * Math.PI * r, h = size / 2;

function streakPanel() {

  for (let i = 6; i >= 0; i--) { const k = iso(addDays(today0(), -i)); dots.push(`<i class="${L.has(k) ? 'on' : off.has(k) ? 'rest' : ''}" title="${k}"></i>`); }

function viewExam(e) {

  let affini = '';
  if (course) {
    const all = allCourses(), me = all.find(c => c.id === course.id), w = makeIdf(all);
    const top = all.filter(c => c.id !== me.id).map(c => ({ c, ...compareSets(me.set, c.set, w) })).filter(r => r.score > 0).sort((a, b) => b.score - a.score).slice(0, 3);

      <div class="row" style="margin-top:10px"><button class="btn small" data-act="goCourse" data-id="${course.id}">Confronta in dettaglio</button></div></section>` : '';
  }
  const topicsHTML = topics.length ? topics.map(t => {

async function submitMaterial(pfx, examId, topic) {
  if (pfx === 'ma') { examId = $('mt-exam').value; topic = $('mt-addtopic').value; }
  const e = examById(examId); if (!e) return showToast('Scegli prima un esame.');
  const title = $(pfx + '-title').value.trim(), text = $(pfx + '-text').value.trim(), type = $(pfx + '-type').value, scope0 = $(pfx + '-scope').value;
  const fi = $(pfx + '-file'), f = fi && fi.files[0];
  if (!title || (!text && !f)) return showToast('Metti un titolo e scrivi qualcosa, oppure allega un PDF.');
  let pdf = null;
  if (f) {
    if (!Net.assets) return showToast('Il caricamento di PDF non è abilitato per il tuo accesso.');
    try { const r = await Net.assets.upload(f, { type: 'application/pdf' }); pdf = { id: r.id, path: r.path || r.id, name: f.name, size: r.sizeBytes }; }
    catch (err) { return showToast(err && err.code === 'too_large' ? 'Il PDF pesa più di 20 MB.' : err && err.code === 'unsupported_type' ? 'Questo file non è un PDF valido.' : 'Caricamento non riuscito' + (Net.mode === 'sb' && err && err.message ? ': ' + err.message : '. Riprova.')); }
  }
  const c = courseById(e.course), rec = { course: e.course || '', courseName: e.name, uni: c ? c.uni : '', topic: topic || '', title, type, text: text.slice(0, 20000), pdf };
  let scope = scope0;
  if (scope !== 'me' && (!Net.db || !e.course)) { scope = 'me'; showToast('Server non disponibile: salvato solo per te.'); }
  if (scope === 'me') st.library.push({ id: 'l' + Date.now(), ...rec, t: Date.now() });
  else { const id = await netAdd('notes', { ...rec, scope }); if (!id) return; st.shared = (st.shared || 0) + 1; }
  ui.openTopic = e.id + '|' + topic;
  setEdy('happy', scope === 'me' ? 'Salvato! Lo vedi solo tu.' : scope === 'class' ? 'Condiviso con la tua classe, grazie!' : 'Online per tutti gli studenti, grazie!');
  checkStamps(); save(); render(true);
}

async function aiSend() {
  const a = ui.ai; if (!a || a.busy || !Net.ai) return;

  let content = text || '(vedi la foto allegata)';
  if (!a.msgs.length) {
    const ctx = a.ctx && a.topic ? libItems().filter(it => it.topic === a.topic && it.text).slice(0, 4).map(it => `- ${it.title}: ${it.text.slice(0, 1200)}`).join('\n') : '';

  } else if (a.mode !== a.lastMode) content = `${AI_MODES[a.mode][1]}\n\n${content}`;
  a.msgs.push({ role: 'user', content, shown: text || 'Foto allegata' });
  const bot = { role: 'assistant', content: '', shown: '', done: false }; a.msgs.push(bot);
  a.busy = true; const img = a.img; a.img = null; setEdy('think', 'Ci penso un attimo. Intanto ricontrolla i dati del problema.'); render(true);
  aiCtl = new AbortController();
  try {
    const opts = { cache: false, signal: aiCtl.signal, onText: ({ text: tx }) => { bot.shown = tx; const n = $('ai-last'); if (n) n.textContent = tx; } };
    if (img && Net.aiImages) opts.images = img;
    const r = await Net.ai(a.msgs.slice(0, -1).map(m => ({ role: m.role, content: m.content })), opts);
    bot.content = r.text; bot.shown = r.text + (r.truncated ? '\n\n(Risposta interrotta: scrivimi "continua".)' : ''); bot.done = true; a.lastMode = a.mode;
    st.act = st.act || { days: [], ai: 0 }; st.act.ai = (st.act.ai || 0) + 1; save(); pushAct();
    setEdy('happy', 'Ecco qua. Se qualcosa non ti torna, scrivimelo.');
  } catch (err) {
    if (err && err.code === 'cancelled' && err.text) { bot.content = bot.shown = err.text; bot.done = true; }
    else { a.msgs.splice(-2, 2); if (!(err && err.code === 'cancelled')) { showToast(aiErrCopy(err && err.code)); if (err && ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled'].includes(err.code)) Net.ai = null; } a.restore = text; }
  }
  a.busy = false; render(true); const x = $('ai-in'); if (x && a.restore) { x.value = a.restore; a.restore = ''; }
}

function updateCompare() {
  const all = allCourses(), me = mineCourse(all), rec = $('recognized'), out = $('cmp-results'); if (!rec || !out) return;

  const pool = all.filter(c => c.id !== me.id), w = makeIdf(all);
  const ranked = pool.map(c => ({ c, ...compareSets(me.set, c.set, w) })).filter(r => r.score > 0).sort((a, b) => b.score - a.score).slice(0, 8);
  if (!me.set.size) { out.innerHTML = ''; setEdy('think', 'Dimmi cosa c\'è nel programma e ti faccio vedere chi studia le stesse cose.'); return refreshEdy(); }

  const top = ranked[0]; setEdy('happy', `Ho messo ${me.name} a confronto con ${pool.length} corsi: il più simile è ${top.c.name} (${top.c.uni}), al ${Math.round(top.score * 100)}%.`); refreshEdy();

    const cfuNote = me.cfu && r.c.cfu ? ` · ${r.c.cfu} CFU (${r.c.cfu === me.cfu ? 'uguali' : r.c.cfu > me.cfu ? 'più dei tuoi' : 'meno dei tuoi'})` : r.c.cfu ? ` · ${r.c.cfu} CFU` : '';

// ----- Statistiche (solo proprietario) -----
function computeStats(D, today) {
  const uniq = a => new Set(a).size, act = D.activity || [];
  const diff = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 864e5);
  const active = act.filter(a => a.days && a.days.length);
  const students = uniq([...D.enrolled.map(x => x.uid), ...active.map(a => a.uid)]);
  const perCourse = {}; D.enrolled.forEach(x => (perCourse[x.course] = perCourse[x.course] || new Set()).add(x.uid));
  const top = Object.entries(perCourse).map(([c, set]) => [c, set.size]).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const first = a => a.days.slice().sort()[0];
  const cohort = active.filter(a => diff(first(a), today) >= 7);            // chi è arrivato almeno 7 giorni fa
  const back7 = cohort.filter(a => a.days.some(d => { const k = diff(first(a), d); return k >= 1 && k <= 7; }));
  const multi = active.filter(a => uniq(a.days) >= 2);
  const aiUsers = act.filter(a => (a.ai || 0) > 0), aiTot = act.reduce((n, a) => n + (a.ai || 0), 0);
  const plus = { m: 0, y: 0, s: 0, no: 0 }; D.plusint.forEach(x => { if (x.choice in plus) plus[x.choice]++; });
  const notes = D.notes;
  return { students, active: active.length, top, cohort: cohort.length, back7: back7.length, multi: multi.length, aiUsers: aiUsers.length, aiTot,
    aiAvg: active.length ? aiTot / active.length : 0, plus, plusN: D.plusint.length,
    notes: notes.length, pdf: notes.filter(n => n.pdf).length, scope: { class: notes.filter(n => n.scope === 'class').length, all: notes.filter(n => n.scope === 'all').length },
    doubts: D.doubts.length, answers: D.answers.length, sessions: D.sessions.length, tutors: D.tutors.length };
}
const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : 'n.d.';
function viewStat() {
  if (!Net.isOwner) return '<div class="empty">Questa scheda è solo per il proprietario della pagina.</div>';
  if (!Net.db) return '<div class="empty">Serve il server della beta per le statistiche.</div>';
  const S = computeStats(Net.data, iso(today0())), cost = S.aiTot * 0.01;
  const kpi = (n, l) => `<div class="mat" style="display:grid;gap:2px"><b style="font-size:26px;font-family:var(--display,inherit)">${n}</b><span>${l}</span></div>`;
  return `<section class="panel"><h2>Statistiche della beta</h2><p class="sub">Numeri aggregati dagli studenti che usano la pagina. Aggiornati in tempo reale.</p>
    <div class="tlist" style="margin-top:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">${kpi(S.students, 'studenti')}${kpi(S.active, 'con accessi registrati')}${kpi(S.multi, 'tornati almeno una volta')}${kpi(S.aiTot, 'domande a Edy')}</div></section>

// ---------- Ricerca unica ----------
function runSearch(q) {
  const box = $('qres'); q = norm(q.trim());
  if (q.length < 2) { box.hidden = true; return; }
  const res = [];
  st.exams.forEach(e => { if (norm(e.name).includes(q)) res.push({ t: 'Esame', n: e.name, s: 'Apri la pagina dell\'esame', act: 'goExam', id: e.id }); });
  st.exams.forEach(e => topicInfo(e).forEach(t => { if (norm(t.label).includes(q)) res.push({ t: 'Argomento', n: t.label, s: e.name, act: 'goExam', id: e.id, topic: e.id + '|' + t.id }); }));
  catalog().forEach(c => { if (norm(c.name + ' ' + c.uni).includes(q)) res.push({ t: 'Corso', n: c.name, s: c.uni + ' · confronta con altri atenei', act: 'goCourse', id: c.id }); });
  CONCEPTS.forEach(c => { if (norm(c.label).includes(q) && !res.some(r => r.n === c.label)) res.push({ t: 'Argomento', n: c.label, s: 'Visto in ' + [...CATALOGUE].filter(x => parseSyllabus(x.text).has(c.id)).length + ' corsi del catalogo', act: 'goCourse', id: ([...CATALOGUE].find(x => parseSyllabus(x.text).has(c.id)) || {}).id }); });
  box.innerHTML = res.slice(0, 8).map(r => `<button data-act="${r.act}" data-id="${r.id}" data-topic="${r.topic || ''}"><span><b>${esc(r.n)}</b> <small>${r.t}</small></span><small>${esc(r.s)}</small></button>`).join('') || '<div class="note" style="padding:8px 10px">Nessun risultato.</div>';
  box.hidden = false;
}

  if (d.classList.contains('topic') && d.open) ui.openTopic = d.dataset.tk;
}, true);
