<title>SyncEdy MVP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra in alto (logo Orbita, ricerca), tab in basso su telefono e in alto su desktop.
   Sotto: colonna laterale con Edy e contesto, a destra la vista attiva. Sotto i 900px tutto in colonna. */
:root {
  /* Palette Orbita: Notte, Teal, Sole, Nebbia. Tema sempre chiaro. */
  --bg: #F7FAFB; --surface: #FFFFFF; --surface-2: #EDF3F5; --ink: #14213D; --muted: #5A6A7D; --line: #E1E8EC;
  --accent: #19C3B2; --accent-ink: #087A70; --accent-soft: #DDF6F3; --sat: #FFC857; --sat-soft: #FFF2D1;
  --ok: #187A45; --warn: #B4400C; --warn-soft: #FDE8DC; --edy-face: #14213D;
  --c1: #19C3B2; --c2: #E8920C; --c3: #E5593B; --c4: #3F7BE0; --c5: #7FAE2E;
  --f-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body);
  padding-block: 0 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1120px; margin: 0 auto; }
[hidden] { display: none !important; }

/* Barra in alto */
.top { display: flex; align-items: center; gap: 12px 24px; flex-wrap: wrap; padding-block: 16px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { width: 36px; height: 36px; flex: none; }
.wm { font: 500 25px/1 var(--f-display); letter-spacing: -0.02em; }
.wm b { font-weight: 800; color: var(--accent-ink); }
.lg-a { stroke: var(--accent); } .lg-b { stroke: var(--ink); } .lg-s { fill: var(--sat); }
.search { position: relative; flex: 1 1 200px; max-width: 360px; }
.search input { background: var(--surface); padding-left: 12px; }
.sres { position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 6px); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px rgb(20 33 61 / .12); padding: 6px; display: grid; gap: 2px; max-height: 340px; overflow: auto; }
.sres button { text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; display: grid; }
.sres button:hover, .sres button:focus-visible { background: var(--surface-2); }
.sres small { color: var(--muted); }
.tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 12px; margin-left: auto; }
.acc { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); color: var(--accent-ink); font: 700 16px/1 var(--f-display); flex: none; padding: 0; }
.acc.on { border-color: var(--accent); background: var(--accent-soft); }
.tab { border: 0; background: none; padding: 8px 14px; border-radius: 9px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(20 33 61 / .12); }
@media (max-width: 760px) {
  body { padding-bottom: 88px; }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; margin: 0; border-radius: 0; background: var(--surface); border-top: 1px solid var(--line); justify-content: space-between;
    padding: 6px max(10px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px)); }
  .tab { flex: 1; padding: 10px 2px; font-size: 12px; text-align: center; }
  .tab[aria-selected="true"] { background: var(--accent-soft); color: var(--accent-ink); box-shadow: none; }
}

.grid { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 900px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  aside { display: contents; }
  #edybox { order: -1; } #view { order: 0; } aside > .panel:not(.edy) { order: 1; }
  .edy-fig { width: 72px; }
}
aside { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
@media (min-width: 901px) { aside { position: sticky; top: 16px; } }
.stack { display: grid; gap: 16px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; min-width: 0; }
h2 { font: 700 20px/1.2 var(--f-display); letter-spacing: -0.01em; margin: 0 0 4px; text-wrap: balance; }
h3 { font: 700 15px/1.3 var(--f-display); margin: 0; }
.sub { color: var(--muted); margin: 0 0 14px; }
.label { font: 500 11px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); }
.mono { font-variant-numeric: tabular-nums; }

/* Edy */
.edy { display: flex; gap: 12px; align-items: flex-start; }
.edy-fig { width: 92px; flex: none; animation: float 4.5s ease-in-out infinite; }
.edy-fig svg { width: 100%; height: auto; display: block; }
.edy-bubble { background: var(--surface-2); border-radius: 14px 14px 14px 4px; padding: 10px 12px; font-size: 14px; min-width: 0; }
.edy-bubble.worried { background: var(--sat-soft); }
.edy-name { font: 700 13px var(--f-display); color: var(--accent-ink); display: block; margin-bottom: 2px; }
.e-planet { fill: var(--accent); } .e-ring { fill: none; stroke: var(--sat); stroke-width: 5; stroke-linecap: round; }
.e-face { fill: var(--edy-face); } .e-line { fill: none; stroke: var(--edy-face); stroke-width: 3.2; stroke-linecap: round; }
.e-drop { fill: #8EDDF5; }
.e-eyes { animation: blink 5s infinite; transform-origin: 60px 46px; }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes blink { 0%,94%,100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }

/* Campi e bottoni */
.fields { display: grid; gap: 12px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: 13px; color: var(--muted); }
input[type=number], input[type=text], input[type=date], select, textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; min-width: 0; }
input[type=number] { font-variant-numeric: tabular-nums; }
textarea { min-height: 84px; resize: vertical; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 600; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #053B36; }
.btn.primary:hover { filter: brightness(1.05); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.big { padding: 12px 18px; font-size: 16px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.between { justify-content: space-between; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 4px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.chip.ok { background: var(--accent-soft); color: var(--accent-ink); }
.chip.gap { background: var(--warn-soft); color: var(--warn); }
.pill { font: 500 11px/1 var(--f-mono); padding: 5px 8px; border-radius: 99px; white-space: nowrap; background: var(--accent-soft); color: var(--accent-ink); }
.pill.risk { background: var(--warn-soft); color: var(--warn); } .pill.done { background: var(--surface-2); color: var(--muted); }
.empty { padding: 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 14px; }

/* Oggi */
.hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; position: relative; }
.ringbox { position: relative; width: 104px; height: 104px; }
.ringbox svg { display: block; }
.ringtxt { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font: 800 22px/1 var(--f-display); }
.ringtxt small { display: block; font: 500 10px var(--f-mono); color: var(--muted); letter-spacing: .06em; margin-top: 3px; }
.hello { font: 700 24px/1.15 var(--f-display); letter-spacing: -0.015em; text-wrap: balance; }
.sparks i { position: absolute; left: 52px; top: 52px; width: 8px; height: 8px; border-radius: 50%; background: var(--sat); animation: spark .9s ease-out forwards; }
@keyframes spark { from { transform: translate(-50%, -50%); opacity: 1; } to { transform: translate(calc(-50% + cos(var(--a)) * 70px), calc(-50% + sin(var(--a)) * 70px)); opacity: 0; } }
.task { background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--c); border-radius: 16px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.task.finished { background: var(--accent-soft); border-color: transparent; border-left-color: var(--c); }
.task h3 { font-size: 18px; }
.task .now { font-size: 15px; }
.task .now b { font-weight: 600; }
.bigrow { display: flex; gap: 8px; flex-wrap: wrap; }
.inline-less { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.inline-less input { width: 96px; }
.streak { display: grid; gap: 10px; }
.streak .num { font: 800 36px/1 var(--f-display); }
.dots { display: flex; gap: 6px; }
.dots i { flex: 1; height: 10px; border-radius: 6px; background: var(--surface-2); }
.dots i.on { background: var(--sat); } .dots i.rest { background: var(--accent-soft); }
.banner { background: var(--sat-soft); border-radius: 16px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

/* Esami */
.exams { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.ecard { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 16px; padding: 14px; display: grid; gap: 10px; text-align: left; width: 100%; }
.ecard:hover { border-color: var(--c); }
.prog { height: 8px; border-radius: 9px; background: var(--surface-2); overflow: hidden; }
.prog > i { display: block; height: 100%; background: var(--c, var(--accent)); border-radius: 9px; }
.topic { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.topic > summary { list-style: none; display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; cursor: pointer; }
.topic > summary::-webkit-details-marker { display: none; }
.dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); }
.dot.doing { border-color: var(--accent); background: linear-gradient(90deg, var(--accent) 50%, transparent 50%); }
.dot.done { border-color: var(--accent); background: var(--accent); }
.tbody { padding: 0 12px 12px; display: grid; gap: 12px; }
.mat { display: flex; justify-content: space-between; gap: 10px; padding: 8px 10px; background: var(--surface-2); border-radius: 10px; font-size: 14px; }
.mat span { color: var(--muted); font-size: 12px; }
.tlist { display: grid; gap: 8px; }
.back { margin-bottom: 4px; }

/* Piano: giorno per giorno */
.stat-row { display: flex; gap: 8px 28px; flex-wrap: wrap; padding: 2px 2px 0; }
.stat b { display: block; font: 700 22px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.days { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.day { display: grid; grid-template-columns: 86px minmax(0, 1fr) 56px auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; border: 1px solid transparent; }
.day.today { background: var(--accent-soft); } .day.off { opacity: .6; } .day.examday { border-color: var(--sat); }
.dl { font: 500 12px/1.25 var(--f-mono); } .dl b { display: block; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.bar { display: flex; height: 18px; background: var(--surface-2); border-radius: 6px; overflow: hidden; gap: 2px; }
.seg { background: var(--c); min-width: 3px; }
.seg.review { background: repeating-linear-gradient(135deg, var(--c) 0 4px, transparent 4px 8px); outline: 1px solid var(--c); outline-offset: -1px; }
.items { grid-column: 2 / 4; font: 400 11px/1.4 var(--f-mono); color: var(--muted); }
.tot { font: 500 13px var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }
.badge-exam { grid-column: 2 / 5; font-weight: 600; color: var(--warn); }
@media (max-width: 520px) { .day { grid-template-columns: 64px minmax(0, 1fr) 46px; } .day .btn { grid-column: 2 / 4; justify-self: start; } .items { grid-column: 1 / 4; } .hero { grid-template-columns: minmax(0, 1fr); } }
.legend { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--c); margin-right: 6px; }

/* Confronto */
.res { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.res summary { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; cursor: pointer; list-style: none; align-items: center; }
.res summary::-webkit-details-marker { display: none; }
.score { font: 800 24px/1 var(--f-display); font-variant-numeric: tabular-nums; text-align: right; }
.score small { font: 500 11px var(--f-mono); display: block; color: var(--muted); letter-spacing: .04em; }
.meter { grid-column: 1 / 3; height: 6px; border-radius: 9px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.res-body { display: grid; gap: 10px; padding-top: 12px; }

/* Passaporto */
.stamps { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.stamp { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 12px; display: grid; gap: 6px; justify-items: center; text-align: center; }
.stamp.got { border-color: var(--sat); background: var(--sat-soft); }
.seal { width: 76px; height: 76px; }
.seal.lock { opacity: .7; }
.tier { font: 500 10px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* Toast */
.toast { position: fixed; z-index: 40; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 14px; font-weight: 600; box-shadow: 0 8px 24px rgb(20 33 61 / .3); max-width: calc(100% - 32px); animation: pop .3s ease-out; }
@keyframes pop { from { transform: translate(-50%, 12px); opacity: 0; } }
@media (min-width: 761px) { .toast { bottom: 28px; } }
@media (prefers-reduced-motion: reduce) { .edy-fig, .e-eyes, .sparks i, .toast { animation: none; } .sparks { display: none; } }
footer { margin-top: 28px; font-size: 12px; color: var(--muted); display: flex; gap: 8px 16px; flex-wrap: wrap; align-items: center; }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand" aria-label="SyncEdy">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <g fill="none" stroke-width="4.6" stroke-linecap="round">
          <path class="lg-a" d="M32 19 A9 9 0 1 0 24 24"/>
          <path class="lg-b" d="M24 24 A9 9 0 1 1 16.2 28.5"/>
        </g>
        <circle class="lg-s" cx="32.4" cy="19.4" r="3.3"/>
      </svg>
      <span class="wm">Sync<b>Edy</b></span>
    </div>
    <div class="search">
      <input type="text" id="q" placeholder="Cerca un argomento, un esame, un corso" autocomplete="off" aria-label="Cerca">
      <div class="sres" id="qres" hidden></div>
    </div>
    <button class="acc" id="accbtn" data-tab="account" aria-label="Il mio account" title="Il mio account">S</button>
    <nav class="tabs" role="tablist" aria-label="Sezioni">
      <button class="tab" role="tab" data-tab="oggi">Oggi</button>
      <button class="tab" role="tab" data-tab="piano">Piano</button>
      <button class="tab" role="tab" data-tab="esami">Esami</button>
      <button class="tab" role="tab" data-tab="materiale">Materiale</button>
      <button class="tab" role="tab" data-tab="confronto">Confronto</button>
      <button class="tab" role="tab" data-tab="passaporto">Passaporto</button>

    <aside id="aside"></aside>
    <main id="view" class="stack"></main>
  </div>

  <footer>
    <span>Versione beta: i corsi e i programmi del catalogo sono esempi inventati.</span><span id="sync"></span>
    <button class="btn small ghost" data-act="reset">Ripristina esempio</button>
  </footer>

<script>
/* ==========================================================================
   SyncEdy MVP v2
   Motori: piano di studio (buildPlan) e confronto corsi (compareSets).
   Sopra: schermata Oggi, pagina esame, dubbi/classe, passaporto EduStamp.
   Nessun server: lo stato sta nel browser (localStorage).
   ========================================================================== */

// ---------- Utilità ----------
const DAY = 86400000;
const today0 = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const iso = d => { const z = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); };
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const dayIdx = (d, t0) => Math.round((d - t0) / DAY);
const fmtH = h => h.toFixed(1).replace('.', ',') + ' h';
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clip = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;
const $ = id => document.getElementById(id);
const firstName = n => String(n || '').trim().split(/\s+/)[0] || '';

// <pure>
// ---------- 1. MOTORE DEL PIANO DI STUDIO ----------
/* Ogni esame ha una scadenza per il materiale nuovo (data esame - giorni di ripasso - 1).
   Ogni giorno, per ogni esame attivo: ritmo = ore ancora da studiare / giorni di studio disponibili.
   Se la somma dei ritmi sta nelle ore del giorno, si assegna quel ritmo (carico uniforme, niente accumulo
   vicino all'esame). Altrimenti si scala in proporzione e l'esame resta con ore mancanti: rischio.
   Il piano si ricalcola da zero a ogni modifica, quindi un ritardo si ridistribuisce da solo. */
function buildPlan(st, t0 = today0()) {
  const cap = st.settings.hours, pph = st.settings.pph, rev = st.settings.review;
  const off = new Set(st.off);
  const isOff = d => off.has(iso(addDays(t0, d)));
  const ex = st.exams.filter(e => !e.passed).map(e => {
    const examDay = dayIdx(parseISO(e.date), t0);
    const remHours = Math.max(0, e.pages - e.done) / pph;
    const studyEnd = Math.min(Math.max(0, examDay - rev - 1), examDay - 1);
    let avail = 0; for (let k = 0; k <= studyEnd; k++) if (!isOff(k)) avail++;
    return { id: e.id, name: e.name, color: e.color, examDay, studyEnd, rem: remHours, avail };
  }).filter(e => e.examDay >= 1);
  const horizon = Math.max(0, ...ex.map(e => e.examDay));
  const rows = [];
  for (let d = 0; d <= horizon; d++) {
    const row = { d, date: addDays(t0, d), off: isOff(d), items: [], total: 0, exams: ex.filter(e => e.examDay === d).map(e => e.name) };
    rows.push(row);
    if (row.off) continue;
    let room = cap;
    const reviewers = ex.filter(e => d > e.studyEnd && d < e.examDay);
    if (reviewers.length) {
      const reserved = room * 0.5;
      reviewers.forEach(e => row.items.push({ id: e.id, h: reserved / reviewers.length, kind: 'review' }));
      room -= reserved;
    }
    const active = ex.filter(e => e.rem > 1e-6 && d <= e.studyEnd);
    if (active.length) {
      const need = active.map(e => {
        let avail = 0; for (let k = d; k <= e.studyEnd; k++) if (!isOff(k)) avail++;
        return { e, rate: e.rem / Math.max(avail, 1) };
      });
      const sum = need.reduce((a, x) => a + x.rate, 0);
      const scale = sum > room ? room / sum : 1;
      need.forEach(x => { const h = x.rate * scale; x.e.rem -= h; row.items.push({ id: x.e.id, h, kind: 'study' }); });
    }
    row.total = row.items.reduce((a, i) => a + i.h, 0);
  }
  ex.forEach(e => { e.short = e.rem > 0.05 ? e.rem : 0; e.extraPerDay = e.short && e.avail ? e.short / e.avail : 0; });
  return { rows, ex, cap, pph, t0 };
}
function planStats(plan) {
  const next = plan.rows.filter(r => r.d < 7 && !r.off);
  const avg7 = next.length ? next.reduce((a, r) => a + r.total, 0) / next.length : 0;
  const peak = Math.max(0, ...plan.rows.map(r => r.total));
  return { avg7, peak, risk: plan.ex.filter(e => e.short > 0) };
}

// ---------- 2. MOTORE DI CONFRONTO TRA CORSI ----------
/* Il programma (italiano o inglese) diventa un insieme di concetti canonici. La somiglianza è un Jaccard
   pesato: i concetti rari (es. Lagrange) contano più di quelli comuni. */
const CONCEPTS = [

function syncEnroll() {                                             // ti iscrive ai corsi dei tuoi esami (solo dopo il percorso iniziale)
  if (!Net.db || !Net.ready) return;
  const want = new Set(st.onboarded ? st.exams.filter(e => e.course && !e.passed).map(e => e.course) : []);
  const have = new Set(Net.data.enrolled.filter(d => d.uid === Net.uid).map(d => d.course));
  want.forEach(c => { if (!have.has(c)) netAdd('enrolled', { course: c }, Net.uid + '_' + c); });

    const ts = $('tab-stat'); if (ts) ts.hidden = !Net.isOwner;

// Argomenti dell'esame: il programma del corso collegato, spalmato sulle pagine totali in parti uguali.
function topicInfo(e) {
  const c = courseById(e.course), ids = c ? orderedTopics(c.text) : [], n = ids.length;
  return ids.map((id, k) => {
    const a = e.pages * k / n, b = e.pages * (k + 1) / n;
    return { id, label: LABEL[id], from: Math.round(a) + 1, to: Math.round(b), status: e.done >= b - 1e-9 ? 'done' : e.done > a ? 'doing' : 'todo' };
  });
}
const currentTopic = e => topicInfo(e).find(t => t.status !== 'done') || null;
function materialsFor(e, topic) {                                    // materiali simulati dai corsi affini del catalogo
  const hash = s => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7), T = ['Appunti', 'Esercizi svolti', 'Riassunto'];
  return allCourses().filter(c => c.id !== e.course && c.set.has(topic)).slice(0, 4).map(c => ({ type: T[hash(c.id + topic) % 3], title: c.name, uni: c.uni }));
}

// ---------- Giornata di oggi: obiettivi, check-in, serie ----------
/* Gli obiettivi del giorno si fissano alla prima apertura e restano stabili finché non c'è un check-in,
   così il numero non cambia sotto gli occhi dello studente mentre studia. */
function snapshotDay(plan) {
  const k = iso(plan.t0);
  if (st.day.date !== k) st.day = { date: k, targets: {}, done: {} };
  if (Object.keys(st.day.done).length) return;
  st.day.targets = {};
  const r = plan.rows[0]; if (!r || r.off) return;
  r.items.forEach(i => {
    const e = examById(i.id);
    if (i.kind === 'study') { const p = Math.min(Math.round(i.h * plan.pph), Math.max(0, e.pages - e.done)); if (p >= 1) st.day.targets[i.id] = { kind: 'study', pages: p, h: i.h }; }
    else st.day.targets[i.id] = { kind: 'review', h: i.h };
  });
}
function goalState() {
  const ids = Object.keys(st.day.targets); let reached = 0, pT = 0, pD = 0;
  ids.forEach(id => {
    const t = st.day.targets[id], d = st.day.done[id] || 0, e = examById(id);
    if (t.kind === 'study') { pT += t.pages; pD += Math.min(d, t.pages); if (d >= t.pages || (e && e.done >= e.pages)) reached++; }
    else if (d >= 1) reached++;
  });
  return { total: ids.length, reached, pT, pD, all: ids.length > 0 && reached === ids.length };
}
function streakOf() {
  const L = new Set(st.log), off = new Set(st.off); let d = today0(), n = 0;
  if (!L.has(iso(d))) d = addDays(d, -1);
  for (let i = 0; i < 400; i++) { const k = iso(d); if (L.has(k)) n++; else if (!off.has(k)) break; d = addDays(d, -1); }
  return n;
}

  <div class="edy-bubble ${edy.mood === 'worried' ? 'worried' : ''}" role="status" aria-live="polite"><span class="edy-name">Edy</span>${esc(edy.text)}</div></div>`;
function refreshEdy() { const n = $('edybox'); if (n) n.outerHTML = edyHTML(); }
function greeting() { const h = new Date().getHours(); return h < 5 ? 'Ciao' : h < 12 ? 'Buongiorno' : h < 18 ? 'Buon pomeriggio' : 'Buonasera'; }
function edyFor(t) {
  const plan = buildPlan(st), s = planStats(plan), soon = plan.ex.find(e => e.examDay <= 7), g = goalState();
  if ((t === 'oggi' || t === 'piano') && s.risk.length) { const e = s.risk[0]; return { mood: 'worried', text: `Occhio a ${e.name}: mancano circa ${fmtH(e.short)}. Aggiungi ${fmtH(e.extraPerDay)} al giorno o accorcia il ripasso e ce la fai.` }; }
  if ((t === 'oggi' || t === 'piano') && soon) return { mood: 'worried', text: `${soon.name} ${soon.examDay === 0 ? 'è oggi' : soon.examDay === 1 ? 'è domani' : `è tra ${soon.examDay} giorni`}: ho rifatto il piano, adesso si punta sul ripasso.` };
  if (t === 'oggi') {
    if (g.total && g.all) return { mood: 'happy', text: 'Missione di oggi compiuta! Il resto della giornata è tuo.' };
    if (g.total && g.reached) return { mood: 'think', text: `Ci sei quasi: ancora ${g.total - g.reached} ${g.total - g.reached === 1 ? 'cosa' : 'cose'} e hai chiuso.` };
    if (g.total) return { mood: 'happy', text: `${greeting()}${firstName(st.name) ? ', ' + firstName(st.name) : ''}! Oggi ${g.total === 1 ? "c'è 1 cosa" : `ci sono ${g.total} cose`} da fare: parti dalla prima, il resto viene da sé.` };
    return { mood: 'happy', text: `${greeting()}${firstName(st.name) ? ', ' + firstName(st.name) : ''}! Oggi sei libero: niente in programma.` };
  }
  if (t === 'piano') return { mood: 'happy', text: 'Ecco il piano. Se salti un giorno, nessun dramma: lo sistemo io.' };
  if (t === 'esami') return { mood: 'happy', text: 'Entra in un esame: argomenti, materiale, dubbi e classe sono lì dentro.' };
  if (t === 'passaporto') { const nx = STAMPS.find(x => !st.stamps[x.id]); return { mood: 'happy', text: nx ? `Ogni timbro è un traguardo vero. Il prossimo: ${nx.title}.` : 'Hai tutti i timbri. Che orbita!' }; }
  if (t === 'account') return { mood: 'happy', text: 'Dimmi che corso segui, così ti trovo chi studia le tue stesse cose.' };
  if (t === 'statistiche') return { mood: 'think', text: 'Qui vedi come va la beta. Questa scheda la vedi solo tu.' };
  if (t === 'materiale') return { mood: 'happy', text: 'Cerca appunti, esercizi e PDF per argomento. Quello che salvi come "solo io" lo vedi solo tu.' };
  return { mood: 'happy', text: 'Eccomi.' };
}

// ---------- Azioni che cambiano lo stato ----------
function mutate(fn) {                                                // ogni modifica ricalcola il piano e fa commentare Edy
  const before = planStats(buildPlan(st));
  fn();
  const after = planStats(buildPlan(st));
  if (after.risk.length) { const e = after.risk[0]; setEdy('worried', `Occhio a ${e.name}: con questi ritmi mancano circa ${fmtH(e.short)}. Aggiungi ${fmtH(e.extraPerDay)} al giorno o accorcia il ripasso e ce la fai.`); }
  else { const d = after.avg7 - before.avg7;
    if (d > 0.15) setEdy('think', `Rifatto! Nei prossimi 7 giorni passi da ${fmtH(before.avg7)} a ${fmtH(after.avg7)} al giorno. Il giorno più pesante resta a ${fmtH(after.peak)}, dentro le tue ore.`);
    else if (d < -0.15) setEdy('happy', `Sei avanti col programma! Nei prossimi 7 giorni si scende da ${fmtH(before.avg7)} a ${fmtH(after.avg7)} al giorno.`);
    else setEdy('happy', `Piano aggiornato: nei prossimi 7 giorni sono ${fmtH(after.avg7)} al giorno.`); }
  checkStamps(); save(); render(true);
}
function checkin(id, pages) {
  snapshotDay(buildPlan(st));
  const t = st.day.targets[id]; if (!t) return;
  const e = examById(id), before = planStats(buildPlan(st));
  if (t.kind === 'study') { const add = Math.max(0, Math.min(pages, e.pages - e.done)); e.done += add; st.day.done[id] = (st.day.done[id] || 0) + add; }
  else st.day.done[id] = 1;
  const k = iso(today0()); if (!st.log.includes(k)) st.log.push(k);
  const g = goalState(), after = planStats(buildPlan(st)), n = streakOf();
  if (g.all) { ui.burst = true; setEdy('happy', `Obiettivo di oggi fatto! ${n > 1 ? `${n} giorni di fila in orbita, continua così.` : 'Primo giorno in orbita, si parte!'}`); }
  else if (t.kind === 'study' && (st.day.done[id] < t.pages)) setEdy('think', `Ok, segnato! Le pagine che mancano le distribuisco sui prossimi giorni: ora sono ${fmtH(after.avg7)} al giorno.`);
  else setEdy('think', `Segnato! Ti ${g.total - g.reached === 1 ? 'resta ancora 1 cosa' : `restano ancora ${g.total - g.reached} cose`} per oggi.`);
  ui.less = null; checkStamps(); save(); render(true);
}

// ---------- Viste ----------
const ring = (pct, size = 104, sw = 10) => { const r = (size - sw) / 2, c = 2 * Math.PI * r, h = size / 2;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="${sw}"/><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="var(--accent)" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c * Math.min(1, pct) } ${c}" transform="rotate(-90 ${h} ${h})"/></svg>`; };

function streakPanel() {
  const n = streakOf(), L = new Set(st.log), off = new Set(st.off), dots = [];
  for (let i = 6; i >= 0; i--) { const k = iso(addDays(today0(), -i)); dots.push(`<i class="${L.has(k) ? 'on' : off.has(k) ? 'rest' : ''}" title="${k}"></i>`); }
  const nx = STAMPS.find(s => s.id === 'streak7' && !st.stamps.streak7);
  return `<section class="panel streak"><span class="label">In orbita</span><div><span class="num">${n}</span> <span class="note">${n === 1 ? 'giorno di fila' : 'giorni di fila'}</span></div>
    <div class="dots" aria-label="Ultimi 7 giorni">${dots.join('')}</div>
    <p class="note" style="margin:0">${nx ? (7 - Math.min(n, 7) === 0 ? 'Timbro 7 giorni sbloccabile oggi.' : `Ti ${7 - n === 1 ? 'manca 1 giorno' : `mancano ${7 - n} giorni`} al timbro 7 giorni.`) : 'Timbro 7 giorni ottenuto.'} I giorni liberi non spezzano la serie.</p></section>`;
}

function taskCard(id, p) {
  const t = st.day.targets[id], e = examById(id), d = st.day.done[id] || 0, tp = currentTopic(e);
  const fin = t.kind === 'study' ? (d >= t.pages || e.done >= e.pages) : d >= 1;
  const weak = (st.weak[id] || []).map(x => LABEL[x]).filter(Boolean);
  let head, now;
  if (t.kind === 'study') {
    head = `${t.pages} pagine · circa ${fmtH(t.h)}`;
    now = tp ? `Argomento: <b>${esc(tp.label)}</b> (pagine ${tp.from}–${tp.to})` : `Pagine ${e.done + 1}–${Math.min(e.pages, e.done + t.pages)}`;
  } else {
    head = `Ripasso · circa ${fmtH(t.h)}`;
    now = weak.length ? `Parti dai tuoi punti deboli: <b>${esc(weak.join(', '))}</b>` : 'Rileggi gli argomenti chiave e rifai gli esercizi che ti sono venuti peggio.';
  }
  const less = ui.less === id ? `<form class="inline-less" data-form="less" data-id="${id}"><label class="note" for="lessn">Pagine fatte</label><input type="number" id="lessn" min="0" max="${t.pages}" value="${Math.round(t.pages / 2)}"><button class="btn small primary" data-act="lessGo" data-id="${id}" type="button">Segna</button><button class="btn small ghost" data-act="lessCancel" type="button">Annulla</button></form>` : '';
  return `<article class="task ${fin ? 'finished' : ''}" style="--c:${e.color}">
    <div class="row between"><h3>${esc(e.name)}</h3><span class="pill ${fin ? 'done' : ''}">${fin ? 'fatto' : esc(head)}</span></div>
    <div class="now">${fin ? (t.kind === 'study' ? `Hai portato a casa ${d} pagine oggi.` : 'Ripasso fatto!') : now}</div>
    ${fin ? '' : `<div class="bigrow"><button class="btn primary big" data-act="checkin" data-id="${id}">Fatto</button>${t.kind === 'study' ? `<button class="btn big" data-act="lessOpen" data-id="${id}">Ne ho fatto un po'</button>` : ''}<button class="btn big ghost" data-act="doubtOpen" data-exam="${id}" data-topic="${tp ? tp.id : ''}">Non mi torna</button>${aiBtn(id, tp ? tp.id : '', true)}</div>${less}`}
    <div><button class="btn small ghost" data-act="openExam" data-id="${id}">Vai all'esame</button></div></article>`;
}

function viewOggi() {
  const plan = buildPlan(st), g = goalState(), rows = plan.rows;
  const pct = g.total ? (g.pT ? g.pD / g.pT : g.reached / g.total) : 0;
  const todayOff = rows[0] && rows[0].off, tomorrow = rows[1];
  const ids = Object.keys(st.day.targets);
  const sparks = ui.burst ? `<div class="sparks" aria-hidden="true">${[0, 45, 90, 135, 180, 225, 270, 315].map(a => `<i style="--a:${a}deg"></i>`).join('')}</div>` : '';
  let body;
  if (!st.exams.length) body = `<div class="empty">Il piano è vuoto: aggiungi un esame e si parte.<div class="row" style="justify-content:center;margin-top:10px"><button class="btn primary" data-act="obStart">Crea il mio piano</button></div></div>`;
  else if (todayOff) body = `<div class="empty">Oggi sei libero: ho già spostato il carico sugli altri giorni e la serie non si spezza.</div>`;
  else if (!ids.length) body = `<div class="empty">Oggi niente in programma. Se hai voglia di portarti avanti, scegli un esame.</div>`;
  else body = ids.map(id => taskCard(id, plan)).join('');
  const next = tomorrow && !tomorrow.off && tomorrow.items.length ? `Domani: ${tomorrow.items.map(i => { const e = examById(i.id); return `${esc(clip(e.name, 22))} ${i.kind === 'study' ? Math.round(i.h * plan.pph) + ' pag' : 'ripasso'}`; }).join(' · ')}` : '';
  return `${!st.onboarded ? `<div class="banner"><div><b>Questo è un piano di prova.</b><br><span class="note">Fai il tuo in un minuto: scegli gli esami e le date.</span></div><button class="btn primary" data-act="obStart">Crea il mio piano</button></div>` : ''}
    ${profileNudge()}
    <section class="panel hero"><div class="ringbox">${ring(pct)}<div class="ringtxt"><div>${g.total ? (g.pT ? `${g.pD}/${g.pT}` : `${g.reached}/${g.total}`) : '—'}<small>${g.pT ? 'PAGINE' : 'OGGI'}</small></div></div>${sparks}</div>
      <div><div class="hello">${greeting()}${firstName(st.name) ? ', ' + esc(firstName(st.name)) : ''}</div><p class="sub" style="margin:4px 0 0">${new Date().toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' })}${next ? '<br>' + next : ''}</p></div></section>
    <div class="stack">${body}</div>
    <div class="row"><button class="btn" data-act="skipToday">Oggi salto</button><span class="note">Nessun problema: sistemo io il piano, senza penalità.</span></div>${classFeed()}`;
}

function asideSettings() {

  return `<section class="panel"><h3>Il tuo ritmo</h3><p class="sub">Cambia un valore e il piano si aggiorna subito.</p><div class="fields">

    <button class="btn primary" data-act="skipToday">Oggi salto, riorganizza tu</button></div></section>`;

function dayRow(r, p) {
  const names = Object.fromEntries(p.ex.map(e => [e.id, e]));
  const lab = r.date.toLocaleDateString('it-IT', { weekday: 'short' }).replace('.', '');
  const dl = `<div class="dl"><b>${lab}</b>${r.date.getDate()} ${r.date.toLocaleDateString('it-IT', { month: 'short' }).replace('.', '')}</div>`;
  const isToday = r.d === 0, key = iso(r.date);
  if (r.exams.length) return `<li class="day examday ${isToday ? 'today' : ''}">${dl}<div class="badge-exam">Esame: ${esc(r.exams.join(', '))}</div></li>`;
  const segs = r.items.map(i => { const e = names[i.id]; return `<span class="seg ${i.kind}" style="--c:${e.color};width:${i.h / p.cap * 100}%" title="${esc(e.name)}"></span>`; }).join('');
  const txt = r.off ? 'giorno libero, il carico è stato spostato' : r.items.map(i => { const e = names[i.id]; return i.kind === 'study' ? `${esc(clip(e.name, 16))} ${Math.round(i.h * p.pph)} pag` : `${esc(clip(e.name, 16))} ripasso`; }).join(' · ');
  return `<li class="day ${isToday ? 'today' : ''} ${r.off ? 'off' : ''}">${dl}<div class="bar" aria-hidden="true">${segs}</div><div class="tot">${r.off ? '0 h' : fmtH(r.total)}</div>
    <button class="btn small ghost" data-act="toggleOff" data-date="${key}">${r.off ? 'Studio' : 'Non studio'}</button><div class="items">${txt || '—'}</div></li>`;
}
function viewPiano() {
  const p = buildPlan(st), s = planStats(p), next = p.ex.length ? Math.min(...p.ex.map(e => e.examDay)) : null;
  const rows = ui.showAll ? p.rows : p.rows.slice(0, 14);
  return `<section class="panel"><h2>Piano di studio</h2><p class="sub">Ogni giorno ti dice quante ore dedicare a ciascun esame. Le strisce sono i giorni di ripasso.</p>
    <div class="stat-row"><div class="stat"><span class="label">Prossimi 7 giorni</span><b>${fmtH(s.avg7)}</b></div>
      <div class="stat"><span class="label">Giorno più pesante</span><b>${fmtH(s.peak)}</b></div>
      <div class="stat"><span class="label">Esami a rischio</span><b style="color:${s.risk.length ? 'var(--warn)' : 'var(--ok)'}">${s.risk.length}</b></div>
      <div class="stat"><span class="label">Primo esame</span><b>${next ? 'tra ' + next + ' g' : '—'}</b></div></div></section>
    <section class="panel"><h2>Giorno per giorno</h2>
      <div class="legend">${st.exams.filter(e => !e.passed).map(e => `<span style="--c:${e.color}"><i></i>${esc(clip(e.name, 24))}</span>`).join('')}</div>
      <ul class="days">${rows.map(r => dayRow(r, p)).join('') || '<li class="empty">Nessun esame in programma.</li>'}</ul>
      ${p.rows.length > 14 ? `<div class="row" style="margin-top:12px"><button class="btn small" data-act="all">${ui.showAll ? 'Mostra solo 14 giorni' : 'Mostra tutto il periodo'}</button></div>` : ''}</section>`;
}

// ----- Esami -----
function examCard(e, plan) {
  const px = plan.ex.find(x => x.id === e.id), days = dayIdx(parseISO(e.date), plan.t0), pct = Math.min(100, e.done / e.pages * 100), tp = currentTopic(e);
  let pill = '<span class="pill">in linea</span>';
  if (e.passed) pill = '<span class="pill done">superato</span>'; else if (days < 1) pill = '<span class="pill done">passato</span>';
  else if (px && px.short > 0) pill = '<span class="pill risk">a rischio</span>'; else if (e.done >= e.pages) pill = '<span class="pill done">completato</span>';
  return `<button class="ecard" style="--c:${e.color}" data-act="openExam" data-id="${e.id}"><div class="row between"><h3>${esc(e.name)}</h3>${pill}</div>
    <div class="prog" aria-hidden="true"><i style="width:${pct}%"></i></div>
    <div class="note mono">${Math.round(pct)}% · ${e.done}/${e.pages} pagine${days >= 1 ? ` · esame tra ${days} giorni` : ''}</div>
    ${tp && !e.passed ? `<div class="note">Adesso: <b>${esc(tp.label)}</b></div>` : ''}</button>`;
}
function viewEsami() {
  if (ui.examId && examById(ui.examId)) return viewExam(examById(ui.examId));
  const plan = buildPlan(st);
  const opts = catalog().map(c => `<option value="${c.id}">${esc(c.name)} · ${esc(c.uni)}</option>`).join('');
  return `<section class="panel"><div class="row between"><div><h2>I tuoi esami</h2><p class="sub" style="margin:0">Apri un esame per vedere argomenti, materiali, dubbi e classe.</p></div><button class="btn" data-act="obStart">Rifai il piano</button></div></section>
    <div class="exams">${st.exams.map(e => examCard(e, plan)).join('') || '<div class="empty">Nessun esame. Aggiungine uno qui sotto.</div>'}</div>
    <details class="panel"><summary><b>Aggiungi un esame</b></summary><div class="fields" style="margin-top:12px">
      <label class="field"><span>Corso (da qui prendo argomenti e materiali)</span><select id="n-course"><option value="">Altro corso, senza argomenti</option>${opts}</select></label>
      <label class="field"><span>Nome</span><input type="text" id="n-name" placeholder="Si compila dal corso scelto"></label>
      <div class="row"><label class="field" style="flex:1 1 120px"><span>Pagine totali</span><input type="number" id="n-pages" min="1" value="250"></label>
        <label class="field" style="flex:1 1 160px"><span>Data esame</span><input type="date" id="n-date" value="${iso(addDays(plan.t0, 45))}"></label></div>
      <button class="btn primary" data-act="add">Aggiungi al piano</button></div></details>`;
}
function viewExam(e) {
  const plan = buildPlan(st), px = plan.ex.find(x => x.id === e.id), days = dayIdx(parseISO(e.date), plan.t0), pct = e.done / e.pages;
  const topics = topicInfo(e), weak = new Set(st.weak[e.id] || []), cur = currentTopic(e);
  const course = courseById(e.course);
  let affini = '';
  if (course) {
    const all = allCourses(), me = all.find(c => c.id === course.id), w = makeIdf(all);
    const top = all.filter(c => c.id !== me.id).map(c => ({ c, ...compareSets(me.set, c.set, w) })).filter(r => r.score > 0).sort((a, b) => b.score - a.score).slice(0, 3);
    affini = top.length ? `<section class="panel"><h3>Corsi affini</h3><p class="sub">Altri atenei che trattano gli stessi argomenti.</p><div class="tlist">${top.map(r => `<div class="mat"><div>${esc(r.c.name)}<br><span>${esc(r.c.uni)}</span></div><b>${Math.round(r.score * 100)}%</b></div>`).join('')}</div>
      <div class="row" style="margin-top:10px"><button class="btn small" data-act="goCourse" data-id="${course.id}">Confronta in dettaglio</button></div></section>` : '';
  }
  const topicsHTML = topics.length ? topics.map(t => {
    const mats = materialsFor(e, t.id), key = e.id + '|' + t.id, w1 = weak.has(t.id);
    return `<details class="topic" ${ui.openTopic === key || (cur && cur.id === t.id && !ui.openTopic) ? 'open' : ''} data-tk="${key}"><summary><span class="dot ${t.status}"></span><span><b>${esc(t.label)}</b><br><span class="note">pagine ${t.from}–${t.to}</span></span>${w1 ? '<span class="chip gap">da ripassare</span>' : '<span></span>'}</summary>
      <div class="tbody"><div class="row"><button class="btn small" data-act="toggleWeak" data-exam="${e.id}" data-topic="${t.id}">${w1 ? 'Ora è chiaro' : 'Non ho capito'}</button><button class="btn small" data-act="doubtOpen" data-exam="${e.id}" data-topic="${t.id}">Non mi torna</button>${aiBtn(e.id, t.id)}</div>
        <div><span class="label">Materiali di corsi affini</span><div class="tlist" style="margin-top:6px">${mats.length ? mats.map(m => `<div class="mat"><div>${esc(m.type)}<br><span>${esc(m.title)} · ${esc(m.uni)}</span></div></div>`).join('') : '<span class="note">Nessun materiale per ora.</span>'}</div><p class="note" style="margin:6px 0 0">Per ora sono esempi: in beta qui trovi gli appunti degli studenti.</p></div>
        <label class="field"><span>I miei appunti su questo argomento</span><textarea data-note="${key}" placeholder="Scrivi una formula, un trucco, una cosa da ricordare">${esc(st.notes[key] || '')}</textarea></label>${materialBlock(e, t.id)}</div></details>`;
  }).join('') : '<div class="empty">Questo esame non ha un programma collegato. Scegli un corso quando lo aggiungi per vedere gli argomenti.</div>';
  const doubts = st.doubts.filter(d => d.examId === e.id).slice().reverse();
  const sess = st.sessions.filter(s => s.examId === e.id);
  const tOpts = topics.map(t => `<option value="${t.id}">${esc(t.label)}</option>`).join('');
  const dOpts = [1, 2, 3, 4, 5, 6, 7].map(n => { const d = addDays(plan.t0, n); return `<option value="${iso(d)}">${d.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'short' })}</option>`; }).join('');
  return `<button class="btn small ghost back" data-act="backExams">← Tutti gli esami</button>
    <section class="panel" style="border-top:4px solid ${e.color}"><div class="row between"><h2>${esc(e.name)}</h2>${e.passed ? '<span class="pill done">superato</span>' : px && px.short > 0 ? '<span class="pill risk">a rischio</span>' : '<span class="pill">in linea</span>'}</div>
      <div class="hero" style="margin-top:8px"><div class="ringbox">${ring(pct)}<div class="ringtxt"><div>${Math.round(pct * 100)}%<small>FATTO</small></div></div></div>
      <div><div class="mono">${e.done} / ${e.pages} pagine</div><div class="note">${days >= 1 ? `Esame tra ${days} giorni (${parseISO(e.date).toLocaleDateString('it-IT', { day: 'numeric', month: 'long' })})` : 'Data già passata'}${px && px.short > 0 ? `. Servono +${fmtH(px.extraPerDay)} al giorno per rientrare.` : ''}</div>

async function submitMaterial(pfx, examId, topic) {
  if (pfx === 'ma') { examId = $('mt-exam').value; topic = $('mt-addtopic').value; }
  const e = examById(examId); if (!e) return showToast('Scegli prima un esame.');

  const fi = $(pfx + '-file'), f = fi && fi.files[0];
  if (!title || (!text && !f)) return showToast('Metti un titolo e scrivi qualcosa, oppure allega un PDF.');
  let pdf = null;
  if (f) {
    if (!Net.assets) return showToast('Il caricamento di PDF non è abilitato per il tuo accesso.');
    try { const r = await Net.assets.upload(f, { type: 'application/pdf' }); pdf = { id: r.id, name: f.name, size: r.sizeBytes }; }
    catch (err) { return showToast(err && err.code === 'too_large' ? 'Il PDF pesa più di 20 MB.' : err && err.code === 'unsupported_type' ? 'Questo file non è un PDF valido.' : 'Caricamento non riuscito. Riprova.'); }

  let scope = scope0;

  if (scope === 'me') st.library.push({ id: 'l' + Date.now(), ...rec, t: Date.now() });

  setEdy('happy', scope === 'me' ? 'Salvato! Lo vedi solo tu.' : scope === 'class' ? 'Condiviso con la tua classe, grazie!' : 'Online per tutti gli studenti, grazie!');

}

// ----- Edy AI: aiuto sui problemi (capability sample) -----
const AI_RULES = "Sei Edy, il tutor di SyncEdy per studenti universitari di ingegneria. Rispondi in italiano, in modo diretto e strutturato. Per un problema di calcolo scrivi ogni passaggio algebrico completo e, a ogni passaggio, una riga breve con il ragionamento fisico o concettuale; chiudi con il risultato e le unità di misura. Per un concetto spiega l'idea e fai un esempio breve. Se mancano dati, chiedili prima di calcolare. Non inventare formule o risultati: se non sei sicuro, dillo. Usa testo semplice, formule su una riga con notazione chiara (es. v = ω × r), senza tabelle. Alla fine suggerisci un controllo (dimensioni, caso limite) che lo studente può fare da solo.";
const AI_MODES = {
  solve: ['Risolvi', 'Risolvi il problema passo passo.'],
  explain: ['Spiegami', "Spiega il concetto partendo dall'idea."],
  check: ['Controlla il mio svolgimento', "Controlla lo svolgimento dello studente: dì cosa è giusto, trova l'errore e spiega come correggerlo, senza riscrivere tutto."],
  practice: ['Dammi un esercizio', "Proponi un esercizio di difficoltà da esame sull'argomento, senza soluzione; la darai solo se lo studente la chiede."],

const aiBtn = (examId, topic, big) => Net.ai ? `<button class="btn ${big ? 'big ghost' : 'small'}" data-act="aiOpen" data-exam="${examId}" data-topic="${topic || ''}">Chiedi a Edy</button>` : '';
let aiCtl;

async function aiSend() {
  const a = ui.ai; if (!a || a.busy || !Net.ai) return;

  a.busy = true; const img = a.img; a.img = null; setEdy('think', 'Ci penso un attimo. Intanto ricontrolla i dati del problema.'); render(true);
  aiCtl = new AbortController();
  try {
    const opts = { cache: false, signal: aiCtl.signal, onText: ({ text: tx }) => { bot.shown = tx; const n = $('ai-last'); if (n) n.textContent = tx; } };
    if (img && Net.aiImages) opts.images = img;
    const r = await Net.ai(a.msgs.slice(0, -1).map(m => ({ role: m.role, content: m.content })), opts);
    bot.content = r.text; bot.shown = r.text + (r.truncated ? '\n\n(Risposta interrotta: scrivimi "continua".)' : ''); bot.done = true; a.lastMode = a.mode;
    st.act = st.act || { days: [], ai: 0 }; st.act.ai = (st.act.ai || 0) + 1; save(); pushAct();
    setEdy('happy', 'Ecco qua. Se qualcosa non ti torna, scrivimelo.');
  } catch (err) {
    if (err && err.code === 'cancelled' && err.text) { bot.content = bot.shown = err.text; bot.done = true; }
    else { a.msgs.splice(-2, 2); if (!(err && err.code === 'cancelled')) { showToast(aiErrCopy(err && err.code)); if (err && ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled'].includes(err.code)) Net.ai = null; } a.restore = text; }
  }
  a.busy = false; render(true); const x = $('ai-in'); if (x && a.restore) { x.value = a.restore; a.restore = ''; }
}

function updateCompare() {
  const all = allCourses(), me = mineCourse(all), rec = $('recognized'), out = $('cmp-results'); if (!rec || !out) return;
  rec.innerHTML = me.set.size ? [...me.set].map(id => `<span class="chip ok">${LABEL[id]}</span>`).join('') : '<span class="note">Nessun argomento riconosciuto. Incolla un programma più completo.</span>';

  const pool = all.filter(c => c.id !== me.id), w = makeIdf(all);
  const ranked = pool.map(c => ({ c, ...compareSets(me.set, c.set, w) })).filter(r => r.score > 0).sort((a, b) => b.score - a.score).slice(0, 8);
  if (!me.set.size) { out.innerHTML = ''; setEdy('think', 'Dimmi cosa c\'è nel programma e ti faccio vedere chi studia le stesse cose.'); return refreshEdy(); }

    const cfuNote = me.cfu && r.c.cfu ? ` · ${r.c.cfu} CFU (${r.c.cfu === me.cfu ? 'uguali' : r.c.cfu > me.cfu ? 'più dei tuoi' : 'meno dei tuoi'})` : r.c.cfu ? ` · ${r.c.cfu} CFU` : '';

      <div><span class="label">Nel tuo corso ma non nel loro (${r.onlyA.length})</span><div class="chips" style="margin-top:6px">${r.onlyA.map(id => `<span class="chip gap">${LABEL[id]}</span>`).join('') || '<span class="note">Nessuno</span>'}</div></div>

}

// ----- Statistiche (solo proprietario) -----
function computeStats(D, today) {
  const uniq = a => new Set(a).size, act = D.activity || [];
  const diff = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 864e5);
  const active = act.filter(a => a.days && a.days.length);
  const students = uniq([...D.enrolled.map(x => x.uid), ...active.map(a => a.uid)]);
  const perCourse = {}; D.enrolled.forEach(x => (perCourse[x.course] = perCourse[x.course] || new Set()).add(x.uid));
  const top = Object.entries(perCourse).map(([c, set]) => [c, set.size]).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const first = a => a.days.slice().sort()[0];
  const cohort = active.filter(a => diff(first(a), today) >= 7);            // chi è arrivato almeno 7 giorni fa
  const back7 = cohort.filter(a => a.days.some(d => { const k = diff(first(a), d); return k >= 1 && k <= 7; }));
  const multi = active.filter(a => uniq(a.days) >= 2);
  const aiUsers = act.filter(a => (a.ai || 0) > 0), aiTot = act.reduce((n, a) => n + (a.ai || 0), 0);
  const plus = { m: 0, y: 0, s: 0, no: 0 }; D.plusint.forEach(x => { if (x.choice in plus) plus[x.choice]++; });
  const notes = D.notes;
  return { students, active: active.length, top, cohort: cohort.length, back7: back7.length, multi: multi.length, aiUsers: aiUsers.length, aiTot,
    aiAvg: active.length ? aiTot / active.length : 0, plus, plusN: D.plusint.length,
    notes: notes.length, pdf: notes.filter(n => n.pdf).length, scope: { class: notes.filter(n => n.scope === 'class').length, all: notes.filter(n => n.scope === 'all').length },
    doubts: D.doubts.length, answers: D.answers.length, sessions: D.sessions.length, tutors: D.tutors.length };
}
const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : 'n.d.';
function viewStat() {
  if (!Net.isOwner) return '<div class="empty">Questa scheda è solo per il proprietario della pagina.</div>';
  if (!Net.db) return '<div class="empty">Serve il server della beta per le statistiche.</div>';
  const S = computeStats(Net.data, iso(today0())), cost = S.aiTot * 0.01;
  const kpi = (n, l) => `<div class="mat" style="display:grid;gap:2px"><b style="font-size:26px;font-family:var(--display,inherit)">${n}</b><span>${l}</span></div>`;
  return `<section class="panel"><h2>Statistiche della beta</h2><p class="sub">Numeri aggregati dagli studenti che usano la pagina. Aggiornati in tempo reale.</p>
    <div class="tlist" style="margin-top:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">${kpi(S.students, 'studenti')}${kpi(S.active, 'con accessi registrati')}${kpi(S.multi, 'tornati almeno una volta')}${kpi(S.aiTot, 'domande a Edy')}</div></section>
    <section class="panel"><h3>Ritorno</h3><p class="sub" style="margin:6px 0 0">${S.cohort ? `Su ${S.cohort} studenti arrivati da almeno 7 giorni, ${S.back7} (${pct(S.back7, S.cohort)}) sono tornati entro la prima settimana.` : 'Il dato a 7 giorni appare quando qualcuno è iscritto da almeno una settimana.'} Obiettivo indicativo del piano di validazione: almeno 30%.</p></section>
    <section class="panel"><h3>Edy AI</h3><p class="sub" style="margin:6px 0 0">${S.aiUsers} studenti l'hanno usato, in media ${S.aiAvg.toFixed(1)} domande per studente attivo. Se Edy fosse a nostro carico a 0,01 € a domanda (ipotesi), finora costerebbe circa ${cost.toFixed(2).replace('.', ',')} €.</p></section>
    <section class="panel"><h3>Interesse per il piano Plus</h3><p class="sub" style="margin:6px 0 10px">${S.plusN} risposte su ${S.students} studenti (${pct(S.plusN, S.students)}).</p>

function doubtPanel() {
  const d = ui.doubt; if (!d) return ''; const e = examById(d.examId); if (!e) return '';
  return `<section class="panel" style="border-color:var(--accent)"><h3>Ho un dubbio${d.topic ? ': ' + esc(LABEL[d.topic]) : ''}</h3><p class="sub">Lo invio alla classe di ${esc(e.name)}.</p>
    <textarea id="dtext" placeholder="Scrivilo in una frase, come lo diresti a un collega"></textarea>
    <div class="row" style="margin-top:10px"><button class="btn primary" data-act="doubtSend">Invia alla classe</button><button class="btn ghost" data-act="doubtClose">Annulla</button></div></section>`;
}

// ---------- Rendering ----------
const TABS = ['oggi', 'piano', 'esami', 'materiale', 'confronto', 'passaporto', 'statistiche', 'account'];
const tabOk = h => TABS.includes(h) && (h !== 'statistiche' || Net.isOwner);
function asideFor() {
  if (tab === 'piano') return asideSettings();
  if (tab === 'materiale') return privacyPanel();
  if (tab === 'statistiche') return '';
  if (tab === 'account') return '';
  if (tab === 'confronto') return `<section class="panel"><h3>Come leggo il punteggio</h3><p class="sub" style="margin:6px 0 0">Traduco ogni programma in argomenti. Un argomento raro, come le equazioni di Lagrange, pesa più di uno comune. Il punteggio è la quota di argomenti condivisi.</p></section>`;
  return streakPanel() + classAside();
}
function render(keepEdy) {
  const plan = buildPlan(st); snapshotDay(plan);
  if (!keepEdy || !edy) { const e = edyFor(tab); setEdy(e.mood, e.text); }
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === tab)));
  const ab = $('accbtn'); if (ab) { ab.classList.toggle('on', tab === 'account'); ab.textContent = ((st.name || '').trim()[0] || 'S').toUpperCase(); }
  $('aside').innerHTML = edyHTML() + asideFor();
  let v;
  if (ui.ob) v = viewOb();
  else v = doubtPanel() + aiPanel() + ({ oggi: viewOggi, piano: viewPiano, esami: viewEsami, materiale: viewMateriale, confronto: viewConfronto, passaporto: viewPassaporto, statistiche: viewStat, account: viewAccount }[tab])();
  $('view').innerHTML = v;
  if (tab === 'confronto' && !ui.ob) updateCompare();
  if (tab === 'materiale' && !ui.ob) { fillAddTopics(); updateMaterial(); }
  setSync();
  if (ui.burst) setTimeout(() => { ui.burst = false; const s = document.querySelector('.sparks'); if (s) s.remove(); }, 1000);
}
function go(t) { if (!tabOk(t)) t = 'oggi'; if (aiCtl) aiCtl.abort(); ui.ai = null; tab = t; ui.ob = null; ui.doubt = null; ui.reply = null; ui.less = null; if (t !== 'esami') ui.examId = null; history.replaceState(null, '', '#' + t); render(); window.scrollTo({ top: 0 }); }

// ---------- Ricerca unica ----------
function runSearch(q) {
  const box = $('qres'); q = norm(q.trim());
  if (q.length < 2) { box.hidden = true; return; }
  const res = [];
  st.exams.forEach(e => { if (norm(e.name).includes(q)) res.push({ t: 'Esame', n: e.name, s: 'Apri la pagina dell\'esame', act: 'goExam', id: e.id }); });
  st.exams.forEach(e => topicInfo(e).forEach(t => { if (norm(t.label).includes(q)) res.push({ t: 'Argomento', n: t.label, s: e.name, act: 'goExam', id: e.id, topic: e.id + '|' + t.id }); }));
  catalog().forEach(c => { if (norm(c.name + ' ' + c.uni).includes(q)) res.push({ t: 'Corso', n: c.name, s: c.uni + ' · confronta con altri atenei', act: 'goCourse', id: c.id }); });
  CONCEPTS.forEach(c => { if (norm(c.label).includes(q) && !res.some(r => r.n === c.label)) res.push({ t: 'Argomento', n: c.label, s: 'Visto in ' + [...CATALOGUE].filter(x => parseSyllabus(x.text).has(c.id)).length + ' corsi del catalogo', act: 'goCourse', id: ([...CATALOGUE].find(x => parseSyllabus(x.text).has(c.id)) || {}).id }); });
  box.innerHTML = res.slice(0, 8).map(r => `<button data-act="${r.act}" data-id="${r.id}" data-topic="${r.topic || ''}"><span><b>${esc(r.n)}</b> <small>${r.t}</small></span><small>${esc(r.s)}</small></button>`).join('') || '<div class="note" style="padding:8px 10px">Nessun risultato.</div>';
  box.hidden = false;
}

// ---------- Eventi (delegati) ----------
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-tab],[data-act]');
  if (!ev.target.closest('.search')) $('qres').hidden = true;
  if (!t) return;
  if (t.dataset.tab) { if (tab !== t.dataset.tab || ui.examId || ui.ob) go(t.dataset.tab); return; }
  const a = t.dataset.act, id = t.dataset.id;
  if (a === 'checkin') { const tg = st.day.targets[id]; checkin(id, tg ? (tg.pages || 0) - (st.day.done[id] || 0) : 0); }
  else if (a === 'lessOpen') { ui.less = id; render(true); const i = $('lessn'); if (i) i.focus(); }
  else if (a === 'lessCancel') { ui.less = null; render(true); }
  else if (a === 'lessGo') checkin(id, Math.max(0, Number($('lessn').value) || 0));
  else if (a === 'skipToday') { const k = iso(today0()); mutate(() => { if (!st.off.includes(k)) st.off.push(k); st.day = { date: k, targets: {}, done: {} }; }); }
  else if (a === 'toggleOff') mutate(() => { const k = t.dataset.date; st.off = st.off.includes(k) ? st.off.filter(x => x !== k) : [...st.off, k]; });
  else if (a === 'all') { ui.showAll = !ui.showAll; render(true); }
  else if (a === 'openExam' || a === 'goExam') { $('qres').hidden = true; ui.examId = id; ui.openTopic = t.dataset.topic || null; tab = 'esami'; history.replaceState(null, '', '#esami'); render(); window.scrollTo({ top: 0 }); }
  else if (a === 'backExams') { ui.examId = null; render(); }
  else if (a === 'goCourse') { $('qres').hidden = true; st.mine = id || st.mine; save(); go('confronto'); }
  else if (a === 'del') { ui.examId = null; mutate(() => { st.exams = st.exams.filter(x => x.id !== id); }); }
  else if (a === 'pass') mutate(() => { examById(id).passed = true; setEdy('happy', 'Esame superato, grande! Ti sei guadagnato un timbro.'); });
  else if (a === 'tutor') mutate(() => { if (!st.tutors.includes(id)) st.tutors.push(id); const ex = examById(id); if (ex && ex.course) netAdd('tutors', { course: ex.course }, Net.uid + '_' + ex.course); });
  else if (a === 'toggleWeak') { const ex = t.dataset.exam, tp = t.dataset.topic, l = st.weak[ex] || []; ui.openTopic = ex + '|' + tp; st.weak[ex] = l.includes(tp) ? l.filter(x => x !== tp) : [...l, tp]; setEdy('think', l.includes(tp) ? 'Ottimo, lo tolgo dai punti deboli.' : 'Ok, lo metto in cima al ripasso.'); save(); render(true); }
  else if (a === 'doubtOpen') { ui.doubt = { examId: t.dataset.exam, topic: t.dataset.topic || '' }; render(true); const x = $('dtext'); if (x) { x.focus(); x.scrollIntoView({ block: 'center' }); } }
  else if (a === 'doubtClose') { ui.doubt = null; render(true); }
  else if (a === 'doubtSend') {
    const text = $('dtext').value.trim(); if (!text) return $('dtext').focus();
    const d = ui.doubt, e = examById(d.examId), m = d.topic ? materialsFor(e, d.topic)[0] : null;
    st.doubts.push({ id: 'd' + Date.now(), examId: d.examId, topic: d.topic, text, date: new Date().toLocaleDateString('it-IT', { day: 'numeric', month: 'short' }) });
    if (e.course) netAdd('doubts', { course: e.course, examName: e.name, topic: d.topic, text });
    ui.doubt = null; setEdy('think', m ? `Domanda inviata alla classe di ${e.name}. Intanto dai un'occhiata a: ${m.type.toLowerCase()} di ${m.title} (${m.uni}).` : `Domanda inviata alla classe di ${e.name}.`);
    checkStamps(); save(); render(true);
  }
  else if (a === 'sessionAdd') {
    const ex = examById(t.dataset.exam), tp = $('sess-topic').value, day = $('sess-day').value;
    if (Net.db && ex.course) netAdd('sessions', { course: ex.course, examName: ex.name, topic: tp, day }).then(sid => { if (sid) netAdd('joins', { sid }, sid + '_' + Net.uid); });
    else st.sessions.push({ id: 's' + Date.now(), examId: ex.id, topic: tp, day: parseISO(day).toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'short' }) });
    setEdy('happy', 'Sessione proposta! Appena un collega vuole studiare lo stesso argomento, la vede.'); save(); render(true);
  }
  else if (a === 'join') netAdd('joins', { sid: id }, id + '_' + Net.uid);
  else if (a === 'leave') netDel('joins', id + '_' + Net.uid);
  else if (a === 'replyOpen') { ui.reply = id; ui.examId = t.dataset.exam; tab = 'esami'; history.replaceState(null, '', '#esami'); render(true); const x = $('rtext'); if (x) { x.focus(); x.scrollIntoView({ block: 'center' }); } }
  else if (a === 'replyClose') { ui.reply = null; render(true); }
  else if (a === 'replySend') {
    const text = $('rtext').value.trim(); if (!text) return $('rtext').focus();
    const d = Net.data.doubts.find(x => x.id === id); netAdd('answers', { doubtId: id, text });
    if (d && d.uid !== Net.uid) st.helped = (st.helped || 0) + 1;
    ui.reply = null; setEdy('happy', 'Risposta inviata: un collega ti ringrazia!'); checkStamps(); save(); render(true);
  }
  else if (a === 'doubtDel') netDel('doubts', id);
  else if (a === 'noteShare') {
    const tp = t.dataset.topic, ex = examById(t.dataset.exam), title = $('nt-title-' + tp).value.trim(), text = $('nt-text-' + tp).value.trim();
    if (!title || !text) { showToast("Metti un titolo e scrivi l'appunto."); return; }
    ui.openTopic = ex.id + '|' + tp; netAdd('notes', { course: ex.course, topic: tp, title, text }); setEdy('happy', 'Appunto condiviso con la classe, grazie!'); refreshEdy();
  }
  else if (a === 'noteDel') netDel('notes', id);
  else if (a === 'add') {
    const course = $('n-course').value, c = course ? courseById(course) : null, name = ($('n-name').value.trim() || (c ? c.name : '')), pages = Number($('n-pages').value), date = $('n-date').value;
    if (!name || !(pages > 0) || !date) { setEdy('think', "Mi servono il nome del corso, le pagine totali e la data dell'esame."); return refreshEdy(); }
    mutate(() => st.exams.push({ id: 'e' + Date.now(), name, course, date, pages, done: 0, color: COLORS[st.exams.length % COLORS.length], passed: false }));
  }
  else if (a === 'saveCourse') {
    const name = $('sv-name').value.trim(); if (!name) return;
    const rec = { name, uni: $('sv-uni').value.trim() || 'Ateneo non indicato', cfu: Number($('sv-cfu').value) || 0, text: st.customText };
    if (Net.db) netAdd('courses', rec).then(cid => { if (cid) { st.mine = 'n' + cid; save(); render(); setEdy('happy', 'Programma salvato nel catalogo: aiuterà anche i tuoi colleghi.'); refreshEdy(); } });
    else { st.custom.push({ id: 'u' + Date.now(), ...rec }); st.mine = st.custom[st.custom.length - 1].id; save(); render(); }
  }
  else if (a === 'obStart') { const plus = n => iso(addDays(today0(), n)); ui.ob = { step: 1, picked: st.onboarded ? st.exams.map(e => e.course).filter(Boolean) : [], dates: {}, pages: {}, hours: st.settings.hours, name: st.name }; catalog().forEach((c, i) => { ui.ob.dates[c.id] = plus(30 + i * 12); ui.ob.pages[c.id] = Math.round(c.cfu * 35); }); if (tab !== 'oggi' && tab !== 'esami') tab = 'oggi'; render(); window.scrollTo({ top: 0 }); }
  else if (a === 'obCancel') { ui.ob = null; render(); }
  else if (a === 'obBack') { ui.ob.step = 1; render(true); }
  else if (a === 'obNext') { if (ui.ob.picked.length) { ui.ob.step = 2; render(true); window.scrollTo({ top: 0 }); } }
  else if (a === 'obFinish') {
    const o = ui.ob;
    st.name = o.name.trim(); st.settings.hours = o.hours > 0 ? o.hours : st.settings.hours;
    st.exams = o.picked.map((cid, i) => { const c = courseById(cid); return { id: 'e' + (Date.now() + i), name: c.name, course: cid, date: o.dates[cid], pages: Math.max(1, o.pages[cid]), done: 0, color: COLORS[i % COLORS.length], passed: false }; });
    st.onboarded = true; st.off = []; st.day = { date: '', targets: {}, done: {} }; ui.ob = null; tab = 'oggi'; history.replaceState(null, '', '#oggi');
    snapshotDay(buildPlan(st)); const g = goalState(), e = edyFor('oggi');
    setEdy(e.mood === 'worried' ? 'worried' : 'happy', `Piano creato${firstName(st.name) ? ', ' + firstName(st.name) : ''}! ` + (g.total ? `Oggi hai ${g.total} ${g.total === 1 ? 'cosa' : 'cose'} da fare. Parti dalla prima.` : e.text)); checkStamps(); save(); render(true); window.scrollTo({ top: 0 });
  }
  else if (a === 'accSave') saveProfile();
  else if (a === 'accSkip') { st.profile = { ...profOf(), skip: true }; save(); render(true); }
  else if (a === 'accDelAsk') { ui.accDel = true; render(true); }
  else if (a === 'accDelNo') { ui.accDel = false; render(true); }
  else if (a === 'accDelGo') deleteMyData();
  else if (a === 'plusPick') { st.plus = t.dataset.v; if (Net.db) netAdd('plusint', { choice: st.plus }, Net.uid); else showToast('Salvato solo su questo dispositivo.'); save(); setEdy('happy', 'Grazie! Ci aiuta a fissare un prezzo giusto.'); render(true); }
  else if (a === 'matAdd') submitMaterial(t.dataset.pfx, t.dataset.exam, t.dataset.topic);
  else if (a === 'libDel') { st.library = st.library.filter(x => x.id !== id); save(); render(true); }
  else if (a === 'aiOpen') { ui.doubt = null; ui.ai = { examId: t.dataset.exam, topic: t.dataset.topic || '', mode: 'solve', msgs: [], busy: false, img: null, ctx: true, lastMode: null }; render(true); const x = $('ai-in'); if (x) { x.focus(); x.scrollIntoView({ block: 'center' }); } }
  else if (a === 'aiClose') { if (aiCtl) aiCtl.abort(); ui.ai = null; render(true); }
  else if (a === 'aiStop') { if (aiCtl) aiCtl.abort(); }
  else if (a === 'aiMode') { const v = $('ai-in').value; ui.ai.mode = t.dataset.m; render(true); $('ai-in').value = v; }
  else if (a === 'aiSend') aiSend();
  else if (a === 'aiSave') {
    const m = ui.ai.msgs[Number(t.dataset.i)], q = ui.ai.msgs[Number(t.dataset.i) - 1], e = examById(ui.ai.examId), c = courseById(e.course);
    st.library.push({ id: 'l' + Date.now(), course: e.course || '', courseName: e.name, uni: c ? c.uni : '', topic: ui.ai.topic, title: 'Edy: ' + clip(q ? q.shown : 'risposta', 50), type: 'Appunti', text: m.content, t: Date.now() });
    showToast('Salvato nei tuoi appunti (solo tu).'); save(); render(true);
  }
  else if (a === 'reset') { st = defaultState(); ui = { examId: null, doubt: null, less: null, ob: null, burst: false, showAll: false, openRes: new Set(), openTopic: null }; save(); go('oggi'); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'ai-img' && ui.ai) { ui.ai.img = t.files[0] || null; const f = $('ai-file'); if (f) f.textContent = ui.ai.img ? ui.ai.img.name : ''; return; }
  if (t.id === 'ai-ctx' && ui.ai) { ui.ai.ctx = t.checked; return; }
  if (t.id === 'mt-exam') { fillAddTopics(); return; }
  if (t.id === 'ac-uni') { const b = $('ac-uni2-box'); if (b) b.hidden = t.value !== '__other'; return; }
  if (t.id === 'mt-topic' || t.id === 'mt-type' || t.id === 'mt-src') { updateMaterial(); return; }
  if (t.dataset.ob) {
    const o = ui.ob, k = t.dataset.ob;
    if (k === 'pick') o.picked = t.checked ? [...o.picked, t.value] : o.picked.filter(x => x !== t.value);
    else if (k === 'name') o.name = t.value; else if (k === 'hours') o.hours = Number(t.value) || 5;
    else if (k === 'date') o.dates[t.dataset.id] = t.value || o.dates[t.dataset.id]; else if (k === 'pages') o.pages[t.dataset.id] = Number(t.value) || o.pages[t.dataset.id];
    if (k === 'pick') render(true); return;
  }
  if (t.dataset.note) { st.notes[t.dataset.note] = t.value; save(); return; }
  if (t.dataset.set) return mutate(() => { st.settings[t.dataset.set] = Math.max(0, Number(t.value) || 0) || st.settings[t.dataset.set]; });
  if (t.dataset.f) return mutate(() => {
    const e = examById(t.dataset.id), f = t.dataset.f;
    if (f === 'name') e.name = t.value.trim() || e.name; else if (f === 'date') e.date = t.value || e.date;
    else { e[f] = Math.max(0, Number(t.value) || 0); if (f === 'pages') e.pages = Math.max(1, e.pages); e.done = Math.min(e.done, e.pages); }
  });
  if (t.id === 'mine') { st.mine = t.value; save(); render(true); }
  if (t.id === 'n-course') { const c = courseById(t.value); if (c) { $('n-name').value = c.name; $('n-pages').value = Math.round(c.cfu * 35); } }
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'syl') { st.customText = ev.target.value; save(); updateCompare(); }
  else if (ev.target.id === 'q') runSearch(ev.target.value);
  else if (ev.target.id === 'mt-q') updateMaterial();
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') $('qres').hidden = true; });
document.addEventListener('toggle', ev => {
  const d = ev.target; if (!d.classList) return;
  if (d.classList.contains('res')) { d.open ? ui.openRes.add(d.dataset.rid) : ui.openRes.delete(d.dataset.rid); }
  if (d.classList.contains('topic') && d.open) ui.openTopic = d.dataset.tk;
}, true);
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (tabOk(h) && h !== tab) { tab = h; ui.ob = null; render(); } });

load();
{ const h = location.hash.slice(1); if (tabOk(h)) tab = h; }
render();
netInit();
async function capInit() {                                          // AI (sample) e caricamento PDF (assets), se la pagina li ha
  try {
    if (!window.claude || !claude.use) return;
    const [ai, assets] = await Promise.all([claude.use('sample').catch(() => null), claude.use('assets').catch(() => null)]);
    Net.ai = ai || null; Net.assets = assets || null;
    if (Net.ai && Net.ai.limits) { try { Net.aiImages = (await Net.ai.limits()).images || null; } catch (e) {} }
    netChanged();
  } catch (e) {}
}
capInit();
</script>
